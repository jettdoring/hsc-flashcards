<style>
:root {
  --paper:#EDF1F0; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#15233B; --ink-2:#3E4D61; --ink-3:#66748A;
  --line:#D5DDE1; --grid:#DCE5E8; --grid-major:#C5D2D8; --accent:#4232BE; --accent-soft:#E8E5FB; --on-accent:#FFFFFF;
  --green:#1C9550; --green-soft:#DCF2E5; --orange:#D97706; --orange-soft:#FCEBD2; --red:#CF3434; --red-soft:#FBE1E1; --new:#9AA6B4;
  --shadow: 0 1px 0 rgba(21,35,59,.06), 0 22px 44px -28px rgba(21,35,59,.45);
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#0E1621; --surface:#172230; --surface-2:#1D2A39; --ink:#E7EDF2; --ink-2:#B9C5D0; --ink-3:#8796A6;
  --line:#2B3A4A; --grid:#1B2735; --grid-major:#243445; --accent:#A79BFF; --accent-soft:#2B2654; --on-accent:#140F33;
  --green:#3DC47C; --green-soft:#15362A; --orange:#F3A53B; --orange-soft:#3B2B15; --red:#F26A6A; --red-soft:#3E2024; --new:#5E6C7C;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 22px 44px -26px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper:#0E1621; --surface:#172230; --surface-2:#1D2A39; --ink:#E7EDF2; --ink-2:#B9C5D0; --ink-3:#8796A6;
  --line:#2B3A4A; --grid:#1B2735; --grid-major:#243445; --accent:#A79BFF; --accent-soft:#2B2654; --on-accent:#140F33;
  --green:#3DC47C; --green-soft:#15362A; --orange:#F3A53B; --orange-soft:#3B2B15; --red:#F26A6A; --red-soft:#3E2024; --new:#5E6C7C;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 22px 44px -26px rgba(0,0,0,.8); color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .font-display, .big, .q, .sh-t, .brand { font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--ink-3); } .sm { font-size: .85rem; }
sub, sup { font-size: .7em; } sub.st { font-size: .62em; }

/* Layout */
.shell { display: flex; min-height: 100%; }
#sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
#main { flex: 1; min-width: 0; }
.topbar { display: none; }
@media (max-width: 899px) {
  #sidebar { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow); width: min(320px, 88vw); }
  body.drawer-open #sidebar { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(10,16,26,.45); display: none; }
  body.drawer-open .scrim { display: block; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
}
.sb-head { padding: 18px 18px 10px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 750; font-size: 1.15rem; letter-spacing: -.01em; }
.strip-logo { display: grid; grid-template-rows: repeat(5, 5px); gap: 2px; width: 14px; }
.strip-logo i { display: block; border-radius: 1.5px; }
#nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-weight: 700; color: var(--ink-2); }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: .75rem; font-weight: 700; margin-left: 6px; }
.badge.sm { min-width: 18px; height: 16px; font-size: .68rem; padding: 0 4px; }
.sb-label { margin: 16px 10px 6px; font-size: .82rem; color: var(--ink-3); }
.tree, .tree-sub { list-style: none; margin: 0; padding: 0; }
.tree-sub { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
.tree-row { display: flex; align-items: center; gap: 2px; border-radius: 8px; padding: 2px 6px 2px 0; }
.tree-row:hover { background: var(--surface-2); }
.tree-row.active { background: var(--accent-soft); }
.tree-row.empty .tl-main, .tree-row.empty .pct { color: var(--ink-3); }
.tw { width: 26px; height: 26px; border-radius: 6px; color: var(--ink-3); font-size: .8rem; flex-shrink: 0; }
.tw:hover { background: var(--line); color: var(--ink); }
.tw-sp { width: 26px; flex-shrink: 0; }
.tree-link { flex: 1; min-width: 0; text-decoration: none; padding: 5px 2px; display: flex; flex-direction: column; }
.tl-main { font-weight: 700; font-size: .95rem; }
.lvl2 .tl-main { font-size: .9rem; }
.tl-sub { font-size: .78rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; }
.deck-link { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px; text-decoration: none; font-size: .85rem; color: var(--ink-2); }
.deck-link:hover { background: var(--surface-2); color: var(--ink); }
.deck-link.active { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.dl-t { min-width: 0; }
.sb-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; font-size: .8rem; color: var(--ink-3); }
#save-status { display: flex; gap: 6px; align-items: baseline; }
#save-status .dot { flex-shrink: 0; transform: translateY(1px); }

/* Generic */
.page { max-width: 1060px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 40px) 64px; display: flex; flex-direction: column; gap: 18px; }
.page-h h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.12; font-weight: 750; letter-spacing: -.02em; }
.lede { color: var(--ink-2); font-size: 1.05rem; margin-top: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.panel.quiet { background: transparent; border-style: dashed; }
.panel h2, section > .panel-h h2, .fa h2 { font-size: 1.15rem; font-weight: 650; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel.empty { text-align: left; padding: 28px; }
.panel.empty h2 { font-size: 1.35rem; margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; cursor: pointer; transition: background .12s, border-color .12s; }
.btn:hover { border-color: var(--ink-3); }
.btn.sm { padding: 6px 12px; font-size: .88rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn:disabled, .btn[disabled] { opacity: .45; cursor: not-allowed; }
kbd { font-family: inherit; font-size: .72rem; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.dot.g { background: var(--green); } .dot.o { background: var(--orange); } .dot.r { background: var(--red); } .dot.n { background: transparent; box-shadow: inset 0 0 0 1.5px var(--new); }
.cnts { display: inline-flex; gap: 10px; flex-wrap: wrap; font-size: .85rem; font-variant-numeric: tabular-nums; }
.cnt { display: inline-flex; align-items: center; }
.mbar { height: 8px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; flex: 1; min-width: 60px; }
.mbar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
.mbar.lg { height: 12px; border-radius: 6px; margin-top: 12px; }
.mb-row { display: flex; align-items: center; gap: 10px; }
.mb-row .num { min-width: 38px; text-align: right; font-size: .9rem; }
.w-40 { width: 10rem; }
.hstats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-top: 10px; color: var(--ink-2); }
.hstats .big { font-size: 1.9rem; font-weight: 750; color: var(--ink); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .88rem; color: var(--ink-3); }
.crumbs a { text-decoration: none; } .crumbs a:hover { text-decoration: underline; color: var(--ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ctype { font-size: .8rem; color: var(--ink-3); }
.spill { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.spill.s-green { background: var(--green-soft); } .spill.s-orange { background: var(--orange-soft); } .spill.s-red { background: var(--red-soft); }
.due-txt { color: var(--red); }

/* Dashboard */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.strip-c { padding: 18px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.strip-c:first-child { border-left: 0; }
.strip-c .big { font-size: 2.1rem; font-weight: 750; line-height: 1.05; letter-spacing: -.02em; }
.strip-c .of { font-size: 1.1rem; color: var(--ink-3); font-weight: 500; }
.ring-c { flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
.mring { width: 76px; height: 76px; flex-shrink: 0; }
.mring-t { fill: none; stroke: var(--surface-2); stroke-width: 11; }
.mring-f { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
@media (max-width: 760px) { .strip { grid-template-columns: 1fr 1fr; } .strip-c:nth-child(3) { border-left: 0; } .strip-c:nth-child(n+3) { border-top: 1px solid var(--line); } }
.dist { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.dist .seg { display: block; height: 100%; }
.seg.g { background: var(--green); } .seg.o { background: var(--orange); } .seg.r { background: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: .9rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 2px; } .legend b { margin-right: 4px; color: var(--ink); }
.bars { width: 100%; height: auto; max-height: 170px; margin: 6px 0 8px; }
.bars .bar-bg { fill: var(--surface-2); } .bars .bar-f { fill: var(--accent); opacity: .75; } .bars .bar-f.today { opacity: 1; } .bars .bar-f2 { fill: var(--orange); }
.bars .tk { font-size: 10px; fill: var(--ink-3); font-family: "Atkinson Hyperlegible", sans-serif; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl thead th { font-size: .8rem; color: var(--ink-3); font-weight: 700; border-bottom: 1.5px solid var(--line); }

<script>/* ---------- Helpers the card files use to write answers ---------- */
const E = s => `<div class="eq">${s}</div>`;

const F = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const DOT_POINTS = {}, IMG = {}, IMG_CAP = {};
/* Card files register themselves here: HSC.addModule({ id, focus, dotPoints, decks, images, imageCaption, viz }) */
const HSC = { modules: {}, addModule(m) {
  if (!m || !m.id) return;
  this.modules[m.id] = m; Object.assign(DOT_POINTS, m.dotPoints || {});
  Object.entries(m.images || {}).forEach(([k, src]) => { IMG[k] = src; IMG_CAP[k] = m.imageCaption || 'From your slides'; });

} };
window.HSC = HSC;

/* --- Titration chemistry: solve the charge balance for [H+] --- */
const KW_ = 1e-14;
function solvePH(Ca, acidKa, Cb, baseKb) {
  const f = h => {
    const A = acidKa === Infinity ? Ca : Ca * acidKa / (acidKa + h);
    const BH = baseKb === Infinity ? Cb : Cb * h / (h + KW_ / baseKb);
    return h + BH - KW_ / h - A;
  };
  let lo = -16, hi = 2;
  for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (f(10 ** m) > 0) hi = m; else lo = m; }
  return -(lo + hi) / 2;
}
function titration({ acidC, acidKa, baseC, baseKb, flask, V0 = 25, Vmax = 50 }) {
  const veq = flask === 'base' ? V0 * baseC / acidC : V0 * acidC / baseC;
  const vs = [];
  for (let i = 0; i <= 160; i++) vs.push(Vmax * i / 160);
  for (let d = -1.2; d <= 1.2; d += 0.03) vs.push(veq + d);
  vs.sort((a, b) => a - b);
  const pts = vs.filter(v => v >= 0 && v <= Vmax).map(v => {
    const Vt = V0 + v;
    const na = flask === 'base' ? acidC * v : acidC * V0;
    const nb = flask === 'base' ? baseC * V0 : baseC * v;
    return [v, solvePH(na / Vt, acidKa, nb / Vt, baseKb)];
  });
  return { pts, veq, phAt: v => { const Vt = V0 + v; const na = flask === 'base' ? acidC * v : acidC * V0; const nb = flask === 'base' ? baseC * V0 : baseC * v; return solvePH(na / Vt, acidKa, nb / Vt, baseKb); } };
}

/* --- Generic SVG line chart --- */
function chart(o) {
  const w = o.w || 360, h = o.h || 230, L = o.L || 38, R = 14, T = 12, B = 38;
  const xMax = o.xMax, yMax = o.yMax ?? 14, pw = w - L - R, ph = h - T - B;
  const X = x => (L + x / xMax * pw).toFixed(1), Y = y => (T + (1 - y / yMax) * ph).toFixed(1);
  let s = `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${o.title}"><title>${o.title}</title>`;
  for (let i = 0; i <= 10; i++) { const x = L + i * pw / 10; s += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${T + ph}"/>`; }
  const ySteps = o.ySteps || 7;
  for (let j = 0; j <= ySteps; j++) { const y = T + j * ph / ySteps; s += `<line class="gl" x1="${L}" x2="${L + pw}" y1="${y}" y2="${y}"/>`; }
  (o.shade || []).forEach(b => { s += `<rect class="shade" x="${X(b.x0)}" y="${T}" width="${(X(b.x1) - X(b.x0)).toFixed(1)}" height="${ph}"/><text class="lbl" x="${((+X(b.x0) + +X(b.x1)) / 2).toFixed(1)}" y="${T + 12}" text-anchor="middle">${b.label}</text>`; });
  (o.bands || []).forEach(b => { s += `<rect class="band ${b.cls}" x="${L}" y="${Y(b.hi)}" width="${pw}" height="${(Y(b.lo) - Y(b.hi)).toFixed(1)}"/><text class="lbl band-lbl" x="${L + pw - 4}" y="${(+Y(b.hi) + +Y(b.lo)) / 2 + 3.5}" text-anchor="end">${b.label}</text>`; });
  (o.guides || []).forEach(g => {
    if (g.x !== undefined) s += `<line class="guide" x1="${X(g.x)}" x2="${X(g.x)}" y1="${g.y !== undefined ? Y(g.y) : T}" y2="${T + ph}"/>`;
    if (g.y !== undefined) s += `<line class="guide" x1="${L}" x2="${g.x !== undefined ? X(g.x) : L + pw}" y1="${Y(g.y)}" y2="${Y(g.y)}"/>`;
  });
  s += `<line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T + ph}"/><line class="ax" x1="${L}" x2="${L + pw}" y1="${T + ph}" y2="${T + ph}"/>`;
  (o.yTicks || []).forEach(t => { s += `<text class="tk" x="${L - 5}" y="${+Y(t) + 3.5}" text-anchor="end">${t}</text>`; });
  (o.xTicks || []).forEach(t => { s += `<text class="tk" x="${X(t)}" y="${T + ph + 13}" text-anchor="middle">${t}</text>`; });
  s += `<text class="axl" x="${L + pw / 2}" y="${h - 6}" text-anchor="middle">${o.xLabel}</text>`;
  s += `<text class="axl" transform="translate(11 ${T + ph / 2}) rotate(-90)" text-anchor="middle">${o.yLabel ?? 'pH'}</text>`;
  (o.series || []).forEach(ser => { s += `<path class="curve ${ser.cls || ''}" d="M${ser.pts.map(p => X(p[0]) + ' ' + Y(Math.max(0, Math.min(yMax, p[1])))).join(' L')}"/>`; });
  (o.marks || []).forEach(m => {
    const mx = +X(m.x), my = +Y(m.y), dx = m.dx ?? 10, dy = m.dy ?? -10;
    s += `<circle class="mk" cx="${mx}" cy="${my}" r="4"/><text class="lbl mk-lbl" x="${mx + dx}" y="${my + dy}" text-anchor="${dx < 0 ? 'end' : 'start'}">${m.label}</text>`;
  });
  return s + '</svg>';
}

const SA = Infinity, KA_ACETIC = 1.8e-5, KB_NH3 = 1.8e-5;
function phCurve(kind, opts = {}) {
  // acid added to base (as in the slides), 1 M each, 25 mL in flask
  const spec = {
    sasb: { acidKa: SA, baseKb: SA }, sawb: { acidKa: SA, baseKb: KB_NH3 },
    wasb: { acidKa: KA_ACETIC, baseKb: SA }, wawb: { acidKa: KA_ACETIC, baseKb: KB_NH3 }
  }[kind];
  const t = titration({ acidC: 1, baseC: 1, flask: 'base', ...spec });
  const eqpH = t.phAt(t.veq);
  return chart({
    title: opts.title || 'Titration curve', xMax: 50, xLabel: 'Volume of acid added (mL)', yTicks: [0, 7, 14], xTicks: [0, 25, 50],
    series: [{ pts: t.pts }], guides: [{ x: t.veq, y: eqpH }], bands: opts.bands || [],
    marks: [{ x: t.veq, y: eqpH, label: `equivalence point (pH ≈ ${eqpH.toFixed(1)})`, dx: -9, dy: -8 }]
  });
}

function curves4() {
  const combos = [['Strong acid + strong base', SA, SA], ['Strong acid + weak base', SA, KB_NH3], ['Weak acid + strong base', KA_ACETIC, SA], ['Weak acid + weak base', KA_ACETIC, KB_NH3]];
  return `<div class="viz grid grid-cols-2 gap-2">${combos.map(([name, ka, kb]) => {
    const t = titration({ acidC: 0.1, baseC: 0.1, acidKa: ka, baseKb: kb, flask: 'acid' });
    return `<div><div class="mini-t">${name}</div>${chart({ title: name + ', base added to acid', w: 200, h: 150, L: 26, xMax: 50, xLabel: 'Base added (mL)', yTicks: [0, 7, 14], series: [{ pts: t.pts }], guides: [{ x: t.veq, y: t.phAt(t.veq) }] })}</div>`;
  }).join('')}</div><p class="viz-cap">0.1 M solutions, base added from the burette. Compare the starting pH, the equivalence point and the final pH.</p>`;
}

function curveBands() {
  return `<div class="viz">${phCurve('sasb', { title: 'Strong acid added to strong base with indicator colour change ranges', bands: [
    { lo: 8.2, hi: 10, cls: 'b-ph', label: 'phenolphthalein' }, { lo: 5.8, hi: 7.6, cls: 'b-btb', label: 'bromothymol blue' }, { lo: 3.1, hi: 4.4, cls: 'b-mo', label: 'methyl orange' }] })}<p class="viz-cap">All three colour changes sit on the vertical section, so each works for a strong acid + strong base titration.</p></div>`;
}

function curveHsc23() {
  const t = titration({ acidC: 0.1, baseC: 0.1, acidKa: SA, baseKb: KB_NH3, flask: 'base' });
  return `<div class="viz">${chart({ title: 'pH against volume of titrant: starts near 11, drops steeply at 25 mL, ends near 2', xMax: 50, xLabel: 'Volume of titrant (mL)', yTicks: [0, 2, 4, 6, 8, 10, 12, 14], xTicks: [0, 10, 20, 30, 40, 50], series: [{ pts: t.pts }] })}</div>`;
}

function curveBuffer() {
  const KaHF = 6.8e-4, pKa = -Math.log10(KaHF);
  const t = titration({ acidC: 0.1, baseC: 0.1, acidKa: KaHF, baseKb: SA, flask: 'acid' });
  return `<div class="viz">${chart({ title: 'HF titrated with NaOH showing the buffer region and half-equivalence point', xMax: 50, xLabel: 'Volume of NaOH added (mL)', yTicks: [0, 7, 14], xTicks: [0, 12.5, 25, 50],
    shade: [{ x0: 3, x1: 22, label: 'buffer region' }], series: [{ pts: t.pts }],
    guides: [{ x: 12.5, y: pKa }, { x: 25, y: t.phAt(25) }],
    marks: [{ x: 12.5, y: pKa, label: `half-equivalence: pH = pKa ≈ ${pKa.toFixed(2)}`, dx: 6, dy: 22 }, { x: 25, y: t.phAt(25), label: 'equivalence', dx: 8, dy: 4 }] })}</div>`;
}

/* --- Particle diagrams --- */
function beaker(x, y, w, h, items, label, sub) {
  let s = `<path class="bk" d="M${x} ${y} L${x} ${y + h - 10} Q${x} ${y + h} ${x + 10} ${y + h} L${x + w - 10} ${y + h} Q${x + w} ${y + h} ${x + w} ${y + h - 10} L${x + w} ${y}"/>`;
  s += `<rect class="liq" x="${x + 2}" y="${y + 18}" width="${w - 4}" height="${h - 20}" rx="8"/>`;
  items.forEach(([k, px, py]) => {
    const cx = x + px * w, cy = y + 22 + py * (h - 30);
    if (k === 'm') s += `<circle class="pm" cx="${cx}" cy="${cy}" r="6"/>`;
    else s += `<circle class="pi" cx="${cx}" cy="${cy}" r="6.5"/><text class="pt" x="${cx}" y="${cy + 3.6}" text-anchor="middle">${k === '+' ? '+' : '−'}</text>`;
  });
  s += `<text class="bl" x="${x + w / 2}" y="${y + h + 16}" text-anchor="middle">${label}</text>`;
  if (sub) s += `<text class="bl2" x="${x + w / 2}" y="${y + h + 29}" text-anchor="middle">${sub}</text>`;

}
function particles() {
  const ions = (n, seed) => { const out = []; for (let i = 0; i < n; i++) { const a = ((i * 37 + seed * 13) % 100) / 100; out.push(['+', 0.15 + ((i * 0.31 + seed * 0.07) % 0.7), 0.1 + ((i * 0.23 + a * 0.3) % 0.8)]); out.push(['-', 0.2 + ((i * 0.29 + seed * 0.11 + 0.35) % 0.66), 0.15 + ((i * 0.41 + 0.2) % 0.75)]); } return out; };
  const mols = (n, seed) => { const out = []; for (let i = 0; i < n; i++) out.push(['m', 0.15 + ((i * 0.27 + seed * 0.05) % 0.7), 0.1 + ((i * 0.37 + seed * 0.03) % 0.8)]); return out; };
  const W = 92, H = 92;
  let s = `<svg viewBox="0 0 470 330" class="chart parts" role="img" aria-label="Particle diagrams: strong acids and bases are all ions, weak ones are mostly intact molecules; concentrated solutions have more particles than dilute"><title>Strength versus concentration particle diagrams</title>`;
  s += beaker(14, 10, W, H, ions(4, 1), 'HNO₃(aq)', 'strong acid');
  s += beaker(130, 10, W, H, [...mols(5, 2), ['+', 0.3, 0.75], ['-', 0.72, 0.62]], 'CH₃COOH(aq)', 'weak acid');
  s += beaker(246, 10, W, H, ions(4, 3), 'NaOH(aq)', 'strong base');
  s += beaker(362, 10, W, H, [...mols(5, 4), ['+', 0.7, 0.25], ['-', 0.3, 0.7]], 'NH₃(aq)', 'weak base');
  s += beaker(110, 168, W, H, ions(6, 5), 'Concentrated HCl', '');
  s += beaker(266, 168, W, H, ions(2, 6), 'Dilute HCl', '');
  s += `<g transform="translate(130 312)"><circle class="pi" cx="0" cy="0" r="6.5"/><text class="pt" x="0" y="3.6" text-anchor="middle">−</text><text class="bl2" x="11" y="4">anion</text><circle class="pi" cx="76" cy="0" r="6.5"/><text class="pt" x="76" y="3.6" text-anchor="middle">+</text><text class="bl2" x="87" y="4">cation</text><circle class="pm" cx="152" cy="0" r="6"/><text class="bl2" x="163" y="4">intact molecule</text></g>`;
  return `<div class="viz">${s}</svg><p class="viz-cap">Water molecules are not shown. Strength is about the fraction ionised; concentration is about how many particles are dissolved.</p></div>`;
}
function neutParticles() {
  const pill = (x, y, t, cls) => `<g><rect class="pill ${cls}" x="${x - 21}" y="${y - 9}" width="42" height="18" rx="9"/><text class="pt2" x="${x}" y="${y + 4}" text-anchor="middle">${t}</text></g>`;
  const BW = 120;
  const bk = (x, inner, label) => `<path class="bk" d="M${x} 0 L${x} 82 Q${x} 92 ${x + 10} 92 L${x + BW - 10} 92 Q${x + BW} 92 ${x + BW} 82 L${x + BW} 0"/><rect class="liq" x="${x + 2}" y="12" width="${BW - 4}" height="78" rx="8"/>${inner}<text class="bl" x="${x + BW / 2}" y="108" text-anchor="middle">${label}</text>`;
  const row = (y, a, b, c, la, lb, lc) => `<g transform="translate(0 ${y})">` + bk(10, a, la) + `<text class="op" x="145" y="56" text-anchor="middle">+</text>` + bk(160, b, lb) + `<text class="op" x="295" y="56" text-anchor="middle">→</text>` + bk(310, c, lc) + '</g>';
  let s = `<svg viewBox="0 0 440 290" class="chart parts" role="img" aria-label="Particle model of neutralisation of a strong acid and a weak acid by sodium hydroxide"><title>Modelling neutralisation</title>`;
  s += `<text class="bl" x="10" y="12">(a) strong acid + strong base</text>`;
  s += row(22, pill(45, 34, 'H⁺', 'ion') + pill(90, 64, 'Cl⁻', 'ion'), pill(195, 34, 'Na⁺', 'ion') + pill(240, 64, 'OH⁻', 'ion'), pill(342, 30, 'Na⁺', 'ion') + pill(397, 30, 'Cl⁻', 'ion') + pill(370, 64, 'H₂O', 'mol'), 'HCl', 'NaOH', 'NaCl + H₂O');
  s += `<text class="bl" x="10" y="160">(b) weak acid + strong base</text>`;
  s += row(170, pill(58, 32, 'CH₃COOH', 'mol wide') + pill(76, 66, 'CH₃COOH', 'mol wide'), pill(195, 34, 'Na⁺', 'ion') + pill(240, 64, 'OH⁻', 'ion'), pill(352, 26, 'CH₃COO⁻', 'ion wide') + pill(405, 26, 'Na⁺', 'ion') + pill(342, 52, 'H₂O', 'mol') + pill(397, 52, 'OH⁻', 'ion') + pill(370, 76, 'CH₃COOH', 'mol wide'), 'CH₃COOH', 'NaOH', 'CH₃COO⁻ + Na⁺ + H₂O');

  kbtable: () => tbl(['Base', 'K<sub>b</sub>', 'pK<sub>b</sub>'], [
    ['Methanamine (CH₃NH₂)', '4.4 × 10⁻⁴', '3.36'], ['Ammonia (NH₃)', '1.7 × 10⁻⁵', '4.76'], ['Ethanoate (CH₃COO⁻)', '5.8 × 10⁻¹⁰', '9.24']], 'Ordered strongest to weakest.'),
  backbar: () => `<div class="viz backbar"><div class="bb-total">Total reagent added (known amount)</div><div class="bb-bar"><div class="bb-a">Reacted with the sample<br><small>found by subtraction</small></div><div class="bb-b">Excess<br><small>measured by titration</small></div></div><p class="viz-cap">n(reacted with sample) = n(total added) − n(excess)</p></div>`,
  bufmech: () => `<div class="viz bufmech"><div class="bm-col"><div class="bm-in">Add H₃O⁺</div><div class="bm-eq">CH₃COO⁻ + H₃O⁺ → CH₃COOH + H₂O</div><div class="bm-why">Conjugate base removes it</div></div><div class="bm-mid">Large reserves of<br><b>CH₃COOH</b> and <b>CH₃COO⁻</b></div><div class="bm-col"><div class="bm-in">Add OH⁻</div><div class="bm-eq">CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O</div><div class="bm-why">Weak acid removes it</div></div></div>`,

const byOrder = (x, y) => (x.o || 0) - (y.o || 0);

function distBar(st) { const n = st.n || 1; return `<div class="dist" role="img" aria-label="${st.g} green, ${st.o} orange, ${st.r} red, ${st.nw} not studied">${['g', 'o', 'r'].map(k => st[k] ? `<span class="seg ${k}" style="width:${st[k] / n * 100}%"></span>` : '').join('')}</div>`; }
function spill(s) { return `<span class="spill s-${s}"><i class="dot ${s[0] === 'n' ? 'n' : s[0]}"></i>${s === 'new' ? STATUS_LABEL.new : (s[0].toUpperCase() + s.slice(1)) + ': ' + STATUS_LABEL[s]}</span>`; }
function ring(pct) { const r = 44, c = 2 * Math.PI * r; return `<svg viewBox="0 0 108 108" class="mring" aria-hidden="true"><circle cx="54" cy="54" r="${r}" class="mring-t"/><circle cx="54" cy="54" r="${r}" class="mring-f" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 54 54)"/></svg>`; }
function crumbs(items) { return `<nav class="crumbs" aria-label="Breadcrumb">${items.map((it, i) => i < items.length - 1 ? `<a href="${it[1]}">${esc(it[0])}</a><span aria-hidden="true">/</span>` : `<span aria-current="page">${esc(it[0])}</span>`).join('')}</nav>`; }
function btn(label, href, cls = 'btn', extra = '') { return href ? `<a class="${cls}" href="${href}" ${extra}>${label}</a>` : `<button class="${cls}" disabled ${extra}>${label}</button>`; }
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
const modTime = id => T().mod[id] || 0;

function renderSaveStatus() {
  const el = $('#save-status'), ac = $('#acct'); if (!el) return;
  const fbMode = !!FB_CFG && !IN_CLAUDE;
  if (ac) {
    if (!fbMode) ac.innerHTML = '';
    else if (FB.user) ac.innerHTML = `<div class="acct"><span class="acct-av" aria-hidden="true">${esc((acctName().trim().charAt(0) || '?').toUpperCase())}</span><div class="acct-t"><b>${esc(acctName())}</b>${FB.user.email && acctName() !== FB.user.email ? `<span class="sm muted">${esc(FB.user.email)}</span>` : ''}</div><button class="linkbtn sm" data-action="signout">Sign out</button></div>`;
    else ac.innerHTML = `<button class="btn btn-primary sm w-full" data-action="auth" data-mode="signin"${FB.ready ? '' : ' disabled'}>${FB.ready ? 'Sign in to sync' : FB.error ? 'Sign-in unavailable' : 'Loading sign-in…'}</button>`;
  }
  const t = Cloud.lastSync ? new Date(Cloud.lastSync).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }) : '';
  let dot = 'g', msg;
  if (!storageOK) { dot = 'r'; msg = 'This browser is blocking storage. Progress will be lost when you close the page; use Back up to keep it.'; }
  else if (Cloud.err) { dot = 'o'; msg = Cloud.err; }
  else if (Cloud.on) msg = `Synced across your devices${t ? ` (last synced ${t})` : ''}.`;
  else if (fbMode && FB.user) { dot = 'o'; msg = 'Connecting to sync…'; }

  else if (fbMode) { dot = 'n'; msg = 'Saved on this device only. Sign in to sync it.'; }

}

function viewDashboard() {

  const maxMs = Math.max(5 * MIN, ...days.map(d => d.ms));
  const bw = 22, gap = 8, ch = 110;
  const barsTime = days.map((d, i) => { const hgt = d.ms / maxMs * ch; const x = i * (bw + gap); const lab = new Date(d.t).getDate();
    return `<g><title>${fmtDate(d.t)}: ${fmtDur(d.ms)} studied, ${plural(d.n, 'review')}</title><rect class="bar-bg" x="${x}" y="0" width="${bw}" height="${ch}" rx="3"/><rect class="bar-f${i === 13 ? ' today' : ''}" x="${x}" y="${(ch - hgt).toFixed(1)}" width="${bw}" height="${hgt.toFixed(1)}" rx="3"/><text class="tk" x="${x + bw / 2}" y="${ch + 14}" text-anchor="middle">${lab}</text></g>`; }).join('');

  const maxF = Math.max(5, ...fc.map(f => f.n));
  const barsF = fc.map((f, i) => { const hgt = f.n / maxF * ch, x = i * 50; return `<g><title>${i === 0 ? 'Today (including overdue)' : fmtDate(f.t)}: ${plural(f.n, 'card')}</title><rect class="bar-bg" x="${x}" y="0" width="34" height="${ch}" rx="3"/><rect class="bar-f2" x="${x}" y="${(ch - hgt).toFixed(1)}" width="34" height="${hgt.toFixed(1)}" rx="3"/><text class="tk" x="${x + 17}" y="${ch - hgt - 4}" text-anchor="middle">${f.n || ''}</text><text class="tk" x="${x + 17}" y="${ch + 14}" text-anchor="middle">${i === 0 ? 'Today' : new Date(f.t).toLocaleDateString('en-AU', { weekday: 'short' })}</text></g>`; }).join('');
  const subjRows = SUBJ.map(s => { const st = stats(cardsFor('subject', s.id));
    return `<tr><th scope="row"><a href="#/subject/${s.id}">${esc(s.name)}</a>${st.n ? '' : '<span class="muted sm"> (no cards yet)</span>'}</th><td class="w-mb"><div class="mb-row">${mbar(st)}<b class="num">${pctTxt(st)}</b></div></td><td>${counts(st)}</td><td class="num">${st.studied}/${st.n}</td><td class="num">${st.dueToday}</td><td class="num">${fmtDur(TT.subj[s.id] || 0)}</td></tr>`; }).join('');
  const modRows = SUBJ.map(s => `<tr class="grp"><th colspan="6" scope="colgroup">${esc(s.name)}</th></tr>` + s.modules.map(m => { const st = stats(cardsFor('module', m.id));
    return `<tr${st.n ? '' : ' class="dim"'}><th scope="row"><a href="#/module/${m.id}">${esc(m.code)}</a> <span class="muted sm">${esc(m.title)}</span></th><td class="w-mb"><div class="mb-row">${mbar(st)}<b class="num">${pctTxt(st)}</b></div></td><td>${st.n ? counts(st) : '<span class="muted sm">Empty</span>'}</td><td class="num">${st.studied}/${st.n}</td><td class="num">${st.dueToday}</td><td class="num">${fmtDur(modTime(m.id))}</td></tr>`; }).join('')).join('');
  return `<div class="page">
  <header class="page-h"><h1>Study dashboard</h1><p class="lede">${FB.user && FB.name ? `Hi ${esc(FB.name.split(' ')[0])}. ` : ''}${fmtDate(Date.now())}. ${all.dueToday ? `You have ${plural(all.dueToday, 'card')} to review today.` : all.studied ? 'Nothing due right now.' : 'Start with Chemistry Module 6 to build your first reviews.'}</p></header>${signinBanner()}${subjectsPrompt()}
  <section class="strip" aria-label="Summary">

    <div class="strip-c"><div class="big num">${fmtDur(TT.total)}</div><div class="muted">total study time</div><div class="sm">${fmtDur(studyToday)} today</div></div>
    <div class="strip-c"><div class="big num">${all.studied}<span class="of">/${all.n}</span></div><div class="muted">cards studied</div><div class="sm">${plural(revs14, 'review')} in 14 days</div></div>
    <div class="strip-c"><div class="big num">${all.dueToday}</div><div class="muted">due for review today</div>${all.dueToday ? `<a class="btn btn-primary sm mt-1" href="#/study/all/all/due">Start review</a>` : `<a class="btn sm mt-1" href="#/module/chem-m6">Study new cards</a>`}</div>
  </section>
  <section class="panel"><div class="panel-h"><h2>Card ratings</h2><span class="muted sm">All subjects</span></div>${distBar(all)}
    <div class="legend"><span><i class="dot g"></i><b class="num">${all.g}</b> Green: got it</span><span><i class="dot o"></i><b class="num">${all.o}</b> Orange: almost there</span><span><i class="dot r"></i><b class="num">${all.r}</b> Red: need review</span><span><i class="dot n"></i><b class="num">${all.nw}</b> not studied</span></div></section>
  <div class="grid md:grid-cols-2 gap-4">
    <section class="panel"><div class="panel-h"><h2>Study time, last 14 days</h2><span class="muted sm">${fmtDur(days.reduce((a, d) => a + d.ms, 0))}</span></div><svg class="bars" viewBox="0 -4 ${14 * (bw + gap) - gap} ${ch + 22}" role="img" aria-label="Minutes studied per day for the last 14 days">${barsTime}</svg><p class="muted sm">Counts only active time inside a flashcard session. The timer pauses after 3 minutes without activity or when the tab is hidden.</p></section>
    <section class="panel"><div class="panel-h"><h2>Reviews coming up</h2><span class="muted sm">next 7 days</span></div><svg class="bars" viewBox="0 -16 ${7 * 50 - 16} ${ch + 34}" role="img" aria-label="Number of cards due each day for the next 7 days">${barsF}</svg><p class="muted sm">Red cards return in 10 minutes, Orange after about a day, Green after 3 days, then longer with each success.</p></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Subjects</h2></div><div class="tbl-wrap"><table class="tbl dash"><thead><tr><th scope="col">Subject</th><th scope="col">Mastery</th><th scope="col">Ratings</th><th scope="col">Studied</th><th scope="col">Due</th><th scope="col">Time</th></tr></thead><tbody>${subjRows}</tbody></table></div></section>
  <section class="panel"><div class="panel-h"><h2>Modules</h2></div><div class="tbl-wrap"><table class="tbl dash"><thead><tr><th scope="col">Module</th><th scope="col">Mastery</th><th scope="col">Ratings</th><th scope="col">Studied</th><th scope="col">Due</th><th scope="col">Time</th></tr></thead><tbody>${modRows}</tbody></table></div></section>

  </div>`;
}

function viewDeck(id) {

  const m = IDX.modules[d.module], s = IDX.subjects[d.subject], st = stats(d.cards);

function viewMissing() { return `<div class="page"><section class="panel empty"><h2>That page doesn’t exist</h2><p class="muted">The link may be out of date.</p><a class="btn btn-primary mt-3" href="#/dashboard">Go to the dashboard</a></section></div>`; }

/* ===================== STUDY SESSION ===================== */
let SESSION = null;
function sessionMeta(scope, id) {
  if (scope === 'deck') { const d = IDX.decks[id]; return d && { title: d.title, back: '#/deck/' + id }; }
  if (scope === 'module') { const m = IDX.modules[id]; return m && { title: `${IDX.subjects[m.subject].name} ${m.code}`, back: '#/module/' + id }; }
  if (scope === 'subject') { const s = IDX.subjects[id]; return s && { title: s.name, back: '#/subject/' + id }; }
  if (scope === 'all') return { title: 'Review due: all subjects', back: '#/review' };
}
const MODE_LABEL = { smart: 'Due and new cards', due: 'Due cards', new: 'New cards', all: 'All cards' };
function startSession(scope, id, mode) {
  const meta = sessionMeta(scope, id); if (!meta) return false;
  const queue = buildQueue(scope, id, mode).map(c => c.id);
  SESSION = { key: [scope, id, mode].join('/'), scope, id, mode, ...meta, queue, i: 0, flipped: false, tally: { green: 0, orange: 0, red: 0 }, shows: {}, hist: [], activeMs: 0 };
  Timer.lastAct = Timer.last = Date.now(); return true;
}
function endSession() { if (!SESSION) return; save(); Cloud.schedule(); SESSION = null; Timer.ctx = null; }
const curCard = () => SESSION && SESSION.i < SESSION.queue.length ? IDX.cards[SESSION.queue[SESSION.i]] : null;

function viewStudy() {
  const c = curCard(), ss = SESSION;
  if (!c) { Timer.ctx = null; return viewSessionDone(); }
  Timer.ctx = { s: c.subject, m: c.module, d: c.deck };
  const r = recOf(c.id), stt = statusOf(c.id), f = ss.flipped, deck = IDX.decks[c.deck];
  const prog = ss.queue.length ? ss.i / ss.queue.length * 100 : 0;
  return `<div class="study">
  <div class="study-h"><a class="btn sm ghost" href="${ss.back}" aria-label="Exit session">← Exit</a>
    <div class="sh-mid"><div class="sh-t">${esc(ss.title)}</div><div class="muted sm">${MODE_LABEL[ss.mode]} · card ${ss.i + 1} of ${ss.queue.length}${ss.scope !== 'deck' ? ` · ${esc(deck.title)}` : ''}</div></div>
    <div class="sh-clock${Timer.active ? '' : ' idle'}"><span id="sess-clock" class="num">${fmtClock(ss.activeMs)}</span><span id="sess-clock-lbl" class="sm">${Timer.active ? 'active study time' : 'paused while idle'}</span></div></div>
  <div class="sess-bar"><span style="width:${prog}%"></span></div>
  <div class="stage">
    <div class="flip enter${f ? ' is-flipped' : ''}" id="flip" data-action="flip" tabindex="0" role="button" aria-label="${f ? 'Showing answer. Press to see the question again' : 'Showing question. Press to reveal the answer'}">
      <div class="flip-inner">
        <section class="face front st-${stt}" aria-hidden="${f}">
          <div class="face-top">${chip(c)}<span class="ctype">${TYPE_LABEL[c.t] || ''}</span><span class="grow"></span>${spill(stt)}</div>
          <div class="q"><div class="q-in">${cq(c)}</div></div>${renderViz(c.vf)}
          <div class="face-foot"><span class="muted sm">${dueLabel(r)}</span><span class="hint">Click the card or press <kbd>Space</kbd> to flip</span></div>
        </section>
        <section class="face back st-${stt}" aria-hidden="${!f}">
          <div class="face-top">${chip(c)}<span class="ctype">Answer</span><span class="grow"></span>${spill(stt)}</div>
          <div class="q-mini">${cqLine(c)}</div>
          <div class="ans">${ca(c)}${renderViz(c.v)}</div>
        </section>
      </div>
    </div>
  </div>
  <div class="rate" id="rate">${rateBar()}</div>
  </div>`;
}
function rateBar() {
  const c = curCard(); if (!c) return '';
  if (!SESSION.flipped) return `<div class="rate-row">${undoBtn()}<button class="btn btn-primary btn-reveal" data-action="flip">Show answer <kbd>Space</kbd></button></div>`;
  const r = recOf(c.id);
  return `<p class="rate-q">How well did you know it?</p><div class="rate-btns">${[['red', 1], ['orange', 2], ['green', 3]].map(([k, n]) => { const p = nextSchedule(r, k);
    return `<button class="rate-btn rb-${k}" data-action="rate" data-r="${k}"><span class="rb-l"><i class="dot ${k[0]}"></i>${STATUS_LABEL[k]}</span><span class="rb-s">Back in ${ivlText(p, k)} <kbd>${n}</kbd></span></button>`; }).join('')}</div>${undoBtn()}`;
}
function viewSessionDone() {
  const ss = SESSION, t = ss.tally, n = t.green + t.orange + t.red;
  const scopeSt = stats(cardsFor(ss.scope, ss.id));
  if (!ss.queue.length) {
    return `<div class="page"><section class="panel empty"><h2>Nothing to study here right now</h2><p class="muted">No cards are due${ss.mode === 'smart' ? ' and there are no new cards' : ''}. ${scopeSt.nextDue < Infinity ? `Next review: ${fmtDate(scopeSt.nextDue)}.` : ''}</p><div class="flex flex-wrap gap-2 mt-3">${ss.scope !== 'all' ? `<a class="btn btn-primary" href="#/study/${ss.scope}/${ss.id}/all">Practise all ${scopeSt.n} cards anyway</a>` : ''}<a class="btn" href="${ss.back}">Go back</a></div></section></div>`;
  }
  return `<div class="page"><section class="panel done"><h1>Session complete</h1><p class="lede">${plural(n, 'rating')} in ${fmtDur(ss.activeMs)} of active study.</p>
  <div class="due-split mt-4"><div class="ds ds-green"><div class="big num">${t.green}</div><div>Got it</div></div><div class="ds ds-orange"><div class="big num">${t.orange}</div><div>Almost there</div></div><div class="ds ds-red"><div class="big num">${t.red}</div><div>Need review</div></div></div>
  <p class="muted mt-4">${esc(ss.title)} is now at <b>${pctTxt(scopeSt)}</b> mastery.${scopeSt.dueToday ? ` ${plural(scopeSt.dueToday, 'card')} still due today (Red cards return after 10 minutes).` : scopeSt.nextDue < Infinity ? ` Next review: ${fmtDate(scopeSt.nextDue)}.` : ''}</p>
  <div class="flex flex-wrap gap-2 mt-4"><a class="btn btn-primary" href="${ss.back}">Done</a>${ss.hist.length ? '<button class="btn" data-action="undo">← Change last rating</button>' : ''}<button class="btn" data-action="restart">Start another round</button><a class="btn" href="#/dashboard">Dashboard</a></div></section></div>`;
}
function flip() {
  if (!SESSION || !curCard()) return;
  SESSION.flipped = !SESSION.flipped;
  const el = $('#flip'); if (!el) return;
  el.classList.remove('enter'); el.classList.toggle('is-flipped', SESSION.flipped);
  el.setAttribute('aria-label', SESSION.flipped ? 'Showing answer. Press to see the question again' : 'Showing question. Press to reveal the answer');
  el.querySelector('.front').setAttribute('aria-hidden', SESSION.flipped); el.querySelector('.back').setAttribute('aria-hidden', !SESSION.flipped);
  $('#rate').innerHTML = rateBar();
  if (SESSION.flipped) { const b = $('.rate-btn.rb-green'); if (b && matchMedia('(pointer:fine)').matches) b.focus({ preventScroll: true }); }
}
function rate(k) {
  const c = curCard(); if (!c || !SESSION.flipped) return;
  const prev = S.cards[c.id] ? JSON.parse(JSON.stringify(S.cards[c.id])) : null;
  const rec = applyRating(c.id, k); SESSION.tally[k]++;
  let ins = -1;
  if (k === 'red') { const n = SESSION.shows[c.id] || 1; if (n < 3) { SESSION.shows[c.id] = n + 1; ins = Math.min(SESSION.queue.length, SESSION.i + 4); SESSION.queue.splice(ins, 0, c.id); } }
  SESSION.hist.push({ id: c.id, prev, k, dk: dayKey(rec.last), i: SESSION.i, ins });
  SESSION.i++; SESSION.flipped = false;
  toast(`<i class="dot ${k[0]}"></i>${STATUS_LABEL[k]}: ${k === 'red' ? 'back later this session' : 'next review ' + fmtDate(rec.due)}`);
  paintMain(); renderSidebar();
}

function undo() {
  if (!SESSION || !SESSION.hist.length) return;
  const h = SESSION.hist.pop();
  if (h.ins >= 0 && SESSION.queue[h.ins] === h.id) { SESSION.queue.splice(h.ins, 1); SESSION.shows[h.id] = Math.max(1, (SESSION.shows[h.id] || 2) - 1); }
  const restored = h.prev ? { ...h.prev } : { reps: 0 }; restored.u = Date.now(); S.cards[h.id] = restored;
  const d = myDev().rev.day[h.dk]; if (d && d[h.k[0]] > 0) d[h.k[0]]--;
  bump(); SESSION.tally[h.k] = Math.max(0, SESSION.tally[h.k] - 1); SESSION.i = h.i; SESSION.flipped = true;
  save(); Cloud.schedule(); paintMain(); renderSidebar();
  toast('Rating undone. Choose the right colour.');
}
const undoBtn = () => SESSION && SESSION.hist.length ? `<button class="btn ghost sm undo-btn" data-action="undo" title="Go back and change your last rating (Z)">← Previous card <kbd>Z</kbd></button>` : '';

async function copyBackup() { const t = $('#bk-out'); t.select(); try { await navigator.clipboard.writeText(t.value); toast('Backup copied.'); } catch (e) { try { document.execCommand('copy'); toast('Backup copied.'); } catch (e2) { toast('Select the text and copy it manually.'); } } }
function restore() {

}

function viewManage() {
  const hid = new Set(hiddenList());
  const row = s => { const n = cardsFor('subject', s.id).length, on = !hid.has(s.id);
    return `<li class="row"><div class="row-main"><div class="row-t">${esc(s.name)}</div><div class="muted sm">${plural(s.modules.length, s.custom ? 'topic' : 'module')}, ${plural(n, 'card')}</div></div><div class="row-side"><button class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="Show ${esc(s.name)}" data-action="toggle-subject" data-id="${s.id}"><span class="knob"></span><span>${on ? 'Showing' : 'Hidden'}</span></button>${s.custom ? `<a class="btn sm" href="#/subject/${s.id}">Open</a>` : ''}</div></li>`; };
  const built = ALLSUBJ.filter(s => s.builtin), own = ALLSUBJ.filter(s => s.custom);
  return `<div class="page">${crumbs([['Dashboard', '#/dashboard'], ['Your subjects', '']])}
  <header class="page-h"><h1>Your subjects</h1><p class="lede">Choose what appears in your sidebar, dashboard and reviews, and add subjects of your own. Hidden subjects keep their progress. ${ownNote()}</p></header>
  <section><div class="panel-h"><h2>Built-in subjects</h2></div><ul class="rows">${built.map(row).join('')}</ul></section>
  <section><div class="panel-h"><h2>Your own subjects</h2><button class="btn btn-primary sm" data-action="add-subject">＋ Add a subject</button></div>${own.length ? `<ul class="rows">${own.map(row).join('')}</ul>` : `<p class="muted">Add any subject you study, then add topics, decks and cards, or import a list you already have.</p>`}</section>
  <section class="panel quiet"><h2>Your own decks in built-in subjects</h2><p class="muted">To add a deck to a built-in module, for example one on your own essay in English Module A, open that module and choose “Add your own deck”.</p></section></div>`;
}

/* ---------- forms ---------- */
function formModal(title, form, id, body, submit, extra = '') {
  openModal(`<h2>${title}</h2><form data-form="${form}" data-id="${id || ''}" novalidate>${body}<p class="au-msg" id="fm-msg" role="alert"></p>
  <div class="flex flex-wrap gap-2 mt-2"><button class="btn btn-primary" type="submit">${submit}</button>${extra}<button class="btn" type="button" data-action="close-modal">Cancel</button></div></form>`);
}
const fld = (label, name, val = '', ph = '', hint = '') => `<label class="fld">${label}${hint ? ` <span class="hint2">${hint}</span>` : ''}<input name="${name}" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="120" autocomplete="off"></label>`;
const area = (label, name, val = '', ph = '', hint = '') => `<label class="fld">${label}${hint ? ` <span class="hint2">${hint}</span>` : ''}<textarea name="${name}" placeholder="${esc(ph)}" maxlength="3000">${esc(val)}</textarea></label>`;
function modalSubject() { formModal('Add a subject', 'subject', '', fld('Subject name', 'name', '', 'e.g. Economics') + fld('First topic or module', 'topic', '', 'e.g. Topic 1: Introduction to economics', '(you can add more later)'), 'Add subject'); }
function modalModule(sid) { formModal('Add a topic', 'module', sid, fld('Topic or module name', 'name', '', 'e.g. Topic 2: Market failure'), 'Add topic'); }
const sciBox = on => `<label class="chk"><input type="checkbox" name="sci"${on ? ' checked' : ''}><span>Format science notation: H_2O shows as H₂O and x^2 as x². Leave off for essays and quotes.</span></label>`;
function modalDeck(mid) { const m = IDX.modules[mid]; formModal(`Add a deck to ${esc(m ? modLabel(m) : 'this module')}`, 'deck', mid, fld('Deck name', 'name', '', 'e.g. My Module A essay') + sciBox(false), 'Add deck'); }
function modalRename(kind, id) {
  const it = (S.custom[kind] || {})[id]; if (!it) return;
  const label = { subjects: 'subject', modules: 'topic', decks: 'deck' }[kind];
  formModal(kind === 'decks' ? 'Deck settings' : `Rename ${label}`, 'rename-' + kind, id, fld(`${label[0].toUpperCase() + label.slice(1)} name`, 'name', it.name) + (kind === 'decks' ? sciBox(it.sci) : ''), 'Save');
}
function modalCard(deckId, cardId) {
  const c = cardId ? S.custom.cards[cardId] : null, did = c ? c.deck : deckId, d = S.custom.decks[did];
  const tips = 'New line = line break; start a line with - for a bullet point.';
  formModal(c ? 'Edit card' : 'Add a card', c ? 'edit-card' : 'add-card', c ? cardId : did,
    area('Front', 'q', c ? c.q : '', 'Question, term or prompt') + area('Back', 'a', c ? c.a : '', 'Answer', tips) + fld('Tag', 'tag', c ? c.tag || '' : '', 'e.g. Mod A, Quote, 7.2', '(optional, shown as a label)'),
    c ? 'Save card' : 'Save card',
    c ? `<button class="btn btn-danger" type="button" data-action="delete" data-kind="cards" data-id="${cardId}">Delete</button>` : `<button class="btn" type="submit" data-more="1">Save and add another</button>`);
  if (d && d.sci) $('#fm-msg').insertAdjacentHTML('beforebegin', '<p class="hint2">Science notation is on for this deck: H_2O → H₂O, x^2 → x².</p>');
}
function parseImport(txt) {
  const out = [];
  String(txt || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
    const parts = l.includes('\t') ? l.split('\t') : l.includes(' | ') ? l.split(' | ') : l.includes('|') ? l.split('|') : l.includes(' :: ') ? l.split(' :: ') : null;
    if (parts && parts.length >= 2) { const q = parts[0].trim(), a = parts.slice(1).join(' | ').trim(); if (q && a) out.push({ q, a }); }
  });
  return out;
}
function modalImport(did) {
  formModal('Import cards', 'import', did, `<p class="muted sm">One card per line, with the front and back separated by a tab (how Quizlet and spreadsheets copy) or by a | character.</p>
  <label class="fld">Cards<textarea id="imp-text" name="text" class="ta-big" placeholder="Hamlet’s tragic flaw | Indecision&#10;Iambic pentameter | Ten syllables per line, unstressed then stressed" autocapitalize="off" spellcheck="false"></textarea></label><p id="imp-prev" class="sm muted">No cards found yet.</p>`, 'Import cards');
}
function importPreview() { const n = parseImport($('#imp-text').value).length, el = $('#imp-prev'); if (el) el.textContent = n ? `${plural(n, 'card')} ready to import.` : 'No cards found yet. Check each line has a tab or | between front and back.'; }

function onForm(f, sub) {
  const v = n => f.elements[n] ? String(f.elements[n].value || '').trim() : '', msg = f.querySelector('#fm-msg'), id = f.dataset.id, kind = f.dataset.form, now = Date.now();
  const fail = t => { msg.textContent = t; return null; };
  S.custom = S.custom || emptyCustom(); S.settings.open = S.settings.open || {};
  if (kind === 'subject') {
    if (!v('name')) return fail('Give the subject a name.');
    const sid = newId('s'), mid = newId('m');
    putCustom('subjects', { id: sid, name: v('name'), o: now }); putCustom('modules', { id: mid, subject: sid, name: v('topic') || 'General', o: now });
    S.settings.open[sid] = true; closeModal(); location.hash = '#/subject/' + sid; commit('Subject added. Now add a deck to its topic.');
  } else if (kind === 'module') {
    if (!v('name')) return fail('Give the topic a name.');
    const mid = newId('m'); putCustom('modules', { id: mid, subject: id, name: v('name'), o: now });
    S.settings.open[id] = true; closeModal(); location.hash = '#/module/' + mid; commit('Topic added.');
  } else if (kind === 'deck') {
    if (!v('name')) return fail('Give the deck a name.');
    const did = newId('d'), sid = IDX.modules[id] && IDX.modules[id].subject;
    putCustom('decks', { id: did, module: id, name: v('name'), sci: !!f.elements.sci.checked, o: now });
    if (sid) { S.settings.open[sid] = true; S.settings.open[id] = true; }
    closeModal(); location.hash = '#/deck/' + did; commit('Deck added. Add cards one by one or import a list.');
  } else if (kind.startsWith('rename-')) {
    const k = kind.slice(7), it = S.custom[k][id]; if (!v('name')) return fail('The name can’t be empty.');
    putCustom(k, { ...it, name: v('name'), ...(k === 'decks' ? { sci: !!f.elements.sci.checked } : {}) }); closeModal(); commit('Saved.');
  } else if (kind === 'add-card' || kind === 'edit-card') {
    if (!v('q')) return fail('The front can’t be empty.'); if (!v('a')) return fail('The back can’t be empty.');
    if (kind === 'edit-card') { putCustom('cards', { ...S.custom.cards[id], q: v('q'), a: v('a'), tag: v('tag') }); closeModal(); commit('Card saved.'); return; }
    putCustom('cards', { id: newId('c'), deck: id, q: v('q'), a: v('a'), tag: v('tag'), o: now }); save(); Cloud.schedule();
    if (sub && sub.dataset.more) { const tag = v('tag'); render(); modalCard(id, null); if (tag) $('[name=tag]').value = tag; toast('Card saved. Add the next one.'); }
    else { closeModal(); commit('Card saved.'); }
  } else if (kind === 'import') {
    const rows = parseImport(f.elements.text.value); if (!rows.length) return fail('No cards found. Put a tab or | between the front and back of each line.');
    rows.forEach((r, i) => putCustom('cards', { id: newId('c') + i, deck: id, q: r.q, a: r.a, tag: '', o: now + i }));
    closeModal(); commit(`${plural(rows.length, 'card')} imported.`);
  }
}

function askDelete(kind, id) {
  const it = (S.custom[kind] || {})[id]; if (!it) return;
  const label = { subjects: 'subject', modules: 'topic', decks: 'deck', cards: 'card' }[kind];
  const n = kind === 'cards' ? 0 : kind === 'decks' ? cardsFor('deck', id).length : kind === 'modules' ? cardsFor('module', id).length : cardsFor('subject', id).length;
  const name = kind === 'cards' ? String(it.q || '').split('\n')[0].slice(0, 80) : it.name;
  openModal(`<h2>Delete this ${label}?</h2><p>“${esc(name)}”${n ? ` and its ${plural(n, 'card')}` : ''} will be deleted${FB.user ? ' from your account on every device' : ''}. This can’t be undone.</p>
  <div class="flex flex-wrap gap-2 mt-4"><button class="btn btn-danger" data-action="confirm-delete" data-kind="${kind}" data-id="${id}">Delete ${label}</button><button class="btn" data-action="close-modal">Cancel</button></div>`);
}
function doDelete(kind, id) {
  const C = S.custom, now = Date.now(), it = C[kind][id]; if (!it) return;
  const kill = (k, i) => { C[k][i] = { id: i, del: true, u: now }; };
  const delDeck = did => { Object.values(C.cards).forEach(c => { if (!c.del && c.deck === did) kill('cards', c.id); }); kill('decks', did); };
  const delMod = mid => { Object.values(C.decks).forEach(d => { if (!d.del && d.module === mid) delDeck(d.id); }); kill('modules', mid); };
  const dest = kind === 'decks' ? '#/module/' + it.module : kind === 'modules' ? '#/subject/' + it.subject : kind === 'subjects' ? '#/subjects' : null;
  if (kind === 'cards') kill('cards', id); else if (kind === 'decks') delDeck(id); else if (kind === 'modules') delMod(id);
  else { Object.values(C.modules).forEach(m => { if (!m.del && m.subject === id) delMod(m.id); }); kill('subjects', id); }
  closeModal(); if (dest) location.hash = dest; commit('Deleted.');
}

/* ===================== ROUTER ===================== */
function route() { const p = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent); return p.length ? p : ['dashboard']; }
function paintMain() {
  const r = route(); let html;
  if (r[0] === 'study') html = viewStudy();
  else if (r[0] === 'review') html = viewReview();
  else if (r[0] === 'subjects') html = viewManage();
  else if (r[0] === 'subject') html = viewSubject(r[1]);
  else if (r[0] === 'module') html = viewModule(r[1]);
  else if (r[0] === 'deck') html = viewDeck(r[1]);
  else html = viewDashboard();
  $('#main').innerHTML = html;
}
function render() {
  if (!BOOTED) return;
  rebuildIndex();
  const r = route();
  if (r[0] === 'study') {
    const key = [r[1], r[2], r[3] || 'smart'].join('/');
    if (!SESSION || SESSION.key !== key) { endSession(); if (!startSession(r[1], r[2], r[3] || 'smart')) { location.hash = '#/dashboard'; return; } }
  } else endSession();
  paintMain(); renderSidebar(); closeDrawer();
  document.title = (r[0] === 'study' && SESSION ? SESSION.title + ' · ' : '') + 'HSC Flashcards';
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => { const prev = lastHash; lastHash = location.hash; render(); if (!(prev.startsWith('#/study') && location.hash.startsWith('#/study'))) window.scrollTo(0, 0); });

/* ===================== EVENTS ===================== */
function openDrawer() { document.body.classList.add('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', 'true'); }
function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  if (act === 'flip') { if (e.target.closest('a, summary')) return; flip(); }
  else if (act === 'rate') rate(a.dataset.r);
  else if (act === 'undo') undo();
  else if (act === 'auth') openAuth(a.dataset.mode);
  else if (act === 'forgot') forgot();
  else if (act === 'signout') doSignOut();
  else if (act === 'claim-guest') claimGuest();
  else if (act === 'toggle-subject') toggleSubject(a.dataset.id);
  else if (act === 'keep-all-subjects') { setHidden(hiddenList()); commit(); }
  else if (act === 'add-subject') modalSubject();
  else if (act === 'add-module') modalModule(a.dataset.id);
  else if (act === 'add-deck') modalDeck(a.dataset.id);
  else if (act === 'add-card') modalCard(a.dataset.id, null);
  else if (act === 'edit-card') modalCard(null, a.dataset.id);
  else if (act === 'import') modalImport(a.dataset.id);
  else if (act === 'rename') modalRename(a.dataset.kind, a.dataset.id);
  else if (act === 'delete') askDelete(a.dataset.kind, a.dataset.id);
  else if (act === 'confirm-delete') doDelete(a.dataset.kind, a.dataset.id);
  else if (act === 'skip-guest') skipGuest();
  else if (act === 'toggle') { const k = a.dataset.key; S.settings.open = S.settings.open || {}; S.settings.open[k] = !S.settings.open[k]; persist(); renderSidebar(); }
  else if (act === 'menu') { document.body.classList.contains('drawer-open') ? closeDrawer() : openDrawer(); }
  else if (act === 'close-drawer') closeDrawer();
  else if (act === 'reset') openReset();
  else if (act === 'do-reset') doReset();
  else if (act === 'backup') openBackup();
  else if (act === 'copy-backup') copyBackup();
  else if (act === 'restore') restore();
  else if (act === 'close-modal') closeModal();
  else if (act === 'restart') { const k = SESSION && SESSION.key; endSession(); if (k) { const [sc, id, md] = k.split('/'); startSession(sc, id, md); paintMain(); renderSidebar(); } }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f) return;
  if (f.id === 'auth-form') { e.preventDefault(); doAuth(f); }
  else if (f.dataset && f.dataset.form) { e.preventDefault(); onForm(f, e.submitter); }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'imp-text') importPreview(); });
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) { closeDrawer(); return; }
  if (route()[0] !== 'study' || !SESSION) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if ((e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); undo(); return; }
  if (!curCard()) return;
  if (e.key === ' ' || e.key === 'Enter') { if (tag === 'button' && e.target.dataset.action === 'rate') return; if (tag === 'a') return; e.preventDefault(); flip(); }
  else if (SESSION.flipped && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); rate({ 1: 'red', 2: 'orange', 3: 'green' }[e.key]); }
  else if (e.key === 'Escape') location.hash = SESSION.back;
});

async function boot() {
  const cat = window.HSC_CATALOG || { files: [] }, v = cat.version ? '?v=' + cat.version : '', failed = [];
  await Promise.all((cat.files || []).map(f => new Promise(res => { const el = document.createElement('script'); el.src = f + v; el.onload = res; el.onerror = () => { failed.push(f); res(); }; document.head.appendChild(el); })));
  BOOTED = true; render();
  if (!window.HSC_CATALOG) toast('Couldn’t load modules.js. Check it’s uploaded next to index.html.');
  else if (failed.length) toast(`Couldn’t load ${failed.join(', ')}. Check it’s uploaded and named exactly as in modules.js.`);
  if (IN_CLAUDE) claudeAdapter().then(ad => Cloud.start(ad));
  else if (FB_CFG) initFirebase();
}
boot();
</script>
</body>
</html>
