<style>
:root {
  --paper:#EDF1F0; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#15233B; --ink-2:#3E4D61; --ink-3:#66748A;
  --line:#D5DDE1; --grid:#DCE5E8; --grid-major:#C5D2D8; --accent:#4232BE; --accent-soft:#E8E5FB; --on-accent:#FFFFFF;
  --green:#1C9550; --green-soft:#DCF2E5; --orange:#D97706; --orange-soft:#FCEBD2; --red:#CF3434; --red-soft:#FBE1E1; --new:#9AA6B4;
  --shadow: 0 1px 0 rgba(21,35,59,.06), 0 22px 44px -28px rgba(21,35,59,.45);
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#0E1621; --surface:#172230; --surface-2:#1D2A39; --ink:#E7EDF2; --ink-2:#B9C5D0; --ink-3:#8796A6;
  --line:#2B3A4A; --grid:#1B2735; --grid-major:#243445; --accent:#A79BFF; --accent-soft:#2B2654; --on-accent:#140F33;
  --green:#3DC47C; --green-soft:#15362A; --orange:#F3A53B; --orange-soft:#3B2B15; --red:#F26A6A; --red-soft:#3E2024; --new:#5E6C7C;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 22px 44px -26px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper:#0E1621; --surface:#172230; --surface-2:#1D2A39; --ink:#E7EDF2; --ink-2:#B9C5D0; --ink-3:#8796A6;
  --line:#2B3A4A; --grid:#1B2735; --grid-major:#243445; --accent:#A79BFF; --accent-soft:#2B2654; --on-accent:#140F33;
  --green:#3DC47C; --green-soft:#15362A; --orange:#F3A53B; --orange-soft:#3B2B15; --red:#F26A6A; --red-soft:#3E2024; --new:#5E6C7C;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 22px 44px -26px rgba(0,0,0,.8); color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
body { background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, .font-display, .big, .q, .sh-t, .brand { font-family: "Bricolage Grotesque", "Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--ink-3); } .sm { font-size: .85rem; }
sub, sup { font-size: .7em; } sub.st { font-size: .62em; }

/* Layout */
.shell { display: flex; min-height: 100%; }
#sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
#main { flex: 1; min-width: 0; }
.topbar { display: none; }
@media (max-width: 899px) {
  #sidebar { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow); width: min(320px, 88vw); }
  body.drawer-open #sidebar { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(10,16,26,.45); display: none; }
  body.drawer-open .scrim { display: block; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
}
.sb-head { padding: 18px 18px 10px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 750; font-size: 1.15rem; letter-spacing: -.01em; }
.strip-logo { display: grid; grid-template-rows: repeat(5, 5px); gap: 2px; width: 14px; }
.strip-logo i { display: block; border-radius: 1.5px; }
#nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-weight: 700; color: var(--ink-2); }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: .75rem; font-weight: 700; margin-left: 6px; }
.badge.sm { min-width: 18px; height: 16px; font-size: .68rem; padding: 0 4px; }
.sb-label { margin: 16px 10px 6px; font-size: .82rem; color: var(--ink-3); }
.tree, .tree-sub { list-style: none; margin: 0; padding: 0; }
.tree-sub { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
.tree-row { display: flex; align-items: center; gap: 2px; border-radius: 8px; padding: 2px 6px 2px 0; }
.tree-row:hover { background: var(--surface-2); }
.tree-row.active { background: var(--accent-soft); }
.tree-row.empty .tl-main, .tree-row.empty .pct { color: var(--ink-3); }
.tw { width: 26px; height: 26px; border-radius: 6px; color: var(--ink-3); font-size: .8rem; flex-shrink: 0; }
.tw:hover { background: var(--line); color: var(--ink); }
.tw-sp { width: 26px; flex-shrink: 0; }
.tree-link { flex: 1; min-width: 0; text-decoration: none; padding: 5px 2px; display: flex; flex-direction: column; }
.tl-main { font-weight: 700; font-size: .95rem; }
.lvl2 .tl-main { font-size: .9rem; }
.tl-sub { font-size: .78rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; }
.deck-link { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px; text-decoration: none; font-size: .85rem; color: var(--ink-2); }
.deck-link:hover { background: var(--surface-2); color: var(--ink); }
.deck-link.active { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.dl-t { min-width: 0; }
.sb-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; font-size: .8rem; color: var(--ink-3); }
#save-status { display: flex; gap: 6px; align-items: baseline; }
#save-status .dot { flex-shrink: 0; transform: translateY(1px); }

/* Generic */
.page { max-width: 1060px; margin: 0 auto; padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 40px) 64px; display: flex; flex-direction: column; gap: 18px; }
.page-h h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.12; font-weight: 750; letter-spacing: -.02em; }
.lede { color: var(--ink-2); font-size: 1.05rem; margin-top: 6px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.panel.quiet { background: transparent; border-style: dashed; }
.panel h2, section > .panel-h h2, .fa h2 { font-size: 1.15rem; font-weight: 650; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel.empty { text-align: left; padding: 28px; }
.panel.empty h2 { font-size: 1.35rem; margin-bottom: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; cursor: pointer; transition: background .12s, border-color .12s; }
.btn:hover { border-color: var(--ink-3); }
.btn.sm { padding: 6px 12px; font-size: .88rem; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn:disabled, .btn[disabled] { opacity: .45; cursor: not-allowed; }
kbd { font-family: inherit; font-size: .72rem; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.dot.g { background: var(--green); } .dot.o { background: var(--orange); } .dot.r { background: var(--red); } .dot.n { background: transparent; box-shadow: inset 0 0 0 1.5px var(--new); }
.cnts { display: inline-flex; gap: 10px; flex-wrap: wrap; font-size: .85rem; font-variant-numeric: tabular-nums; }
.cnt { display: inline-flex; align-items: center; }
.mbar { height: 8px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; flex: 1; min-width: 60px; }
.mbar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
.mbar.lg { height: 12px; border-radius: 6px; margin-top: 12px; }
.mb-row { display: flex; align-items: center; gap: 10px; }
.mb-row .num { min-width: 38px; text-align: right; font-size: .9rem; }
.w-40 { width: 10rem; }
.hstats { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-top: 10px; color: var(--ink-2); }
.hstats .big { font-size: 1.9rem; font-weight: 750; color: var(--ink); }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: .88rem; color: var(--ink-3); }
.crumbs a { text-decoration: none; } .crumbs a:hover { text-decoration: underline; color: var(--ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ctype { font-size: .8rem; color: var(--ink-3); }
.spill { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.spill.s-green { background: var(--green-soft); } .spill.s-orange { background: var(--orange-soft); } .spill.s-red { background: var(--red-soft); }
.due-txt { color: var(--red); }

/* Dashboard */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.strip-c { padding: 18px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.strip-c:first-child { border-left: 0; }
.strip-c .big { font-size: 2.1rem; font-weight: 750; line-height: 1.05; letter-spacing: -.02em; }
.strip-c .of { font-size: 1.1rem; color: var(--ink-3); font-weight: 500; }
.ring-c { flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start; }
.mring { width: 76px; height: 76px; flex-shrink: 0; }
.mring-t { fill: none; stroke: var(--surface-2); stroke-width: 11; }
.mring-f { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
@media (max-width: 760px) { .strip { grid-template-columns: 1fr 1fr; } .strip-c:nth-child(3) { border-left: 0; } .strip-c:nth-child(n+3) { border-top: 1px solid var(--line); } }
.dist { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.dist .seg { display: block; height: 100%; }
.seg.g { background: var(--green); } .seg.o { background: var(--orange); } .seg.r { background: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: .9rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 2px; } .legend b { margin-right: 4px; color: var(--ink); }
.bars { width: 100%; height: auto; max-height: 170px; margin: 6px 0 8px; }
.bars .bar-bg { fill: var(--surface-2); } .bars .bar-f { fill: var(--accent); opacity: .75; } .bars .bar-f.today { opacity: 1; } .bars .bar-f2 { fill: var(--orange); }
.bars .tk { font-size: 10px; fill: var(--ink-3); font-family: "Atkinson Hyperlegible", sans-serif; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl thead th { font-size: .8rem; color: var(--ink-3); font-weight: 700; border-bottom: 1.5px solid var(--line); }
.tbl tbody th { font-weight: 700; }
.tbl.dash a { text-decoration: none; } .tbl.dash a:hover { text-decoration: underline; }
.tbl .w-mb { min-width: 170px; }
.tbl tr.grp th { background: var(--surface-2); font-size: .82rem; color: var(--ink-2); }
.tbl tr.dim { color: var(--ink-3); }
.due-split { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ds { border-radius: 12px; padding: 14px 16px; border: 1.5px solid; }
.ds .big { font-size: 1.9rem; font-weight: 750; }

/* Lists */

.fa { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

.dps { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: .85rem; margin: 12px 0 8px; }
.card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

.cl summary::-webkit-details-marker { display: none; }
.cl-q { flex: 1; } .cl-d { font-size: .8rem; color: var(--ink-3); white-space: nowrap; margin-left: 10px; }

.note { font-size: .9rem; color: var(--ink-2); background: var(--surface-2); padding: 7px 11px; border-radius: 8px; margin-top: 10px !important; }

.chart { width: 100%; height: auto; display: block; max-width: 480px; }

.chart .ax { stroke: var(--ink-3); stroke-width: 1.2; }

.chart .tk { font-size: 10px; } .chart .axl { font-size: 10.5px; fill: var(--ink-2); } .chart .lbl { font-size: 10px; fill: var(--ink-2); }
.chart .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; }

.chart .band-lbl { font-size: 9.5px; fill: var(--ink); }
.chart .shade { fill: var(--accent-soft); opacity: .8; }
.parts .bk { fill: none; stroke: var(--ink-2); stroke-width: 2; }
.parts .liq { fill: var(--accent-soft); opacity: .55; }

.parts .pi { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }

.parts .bl { font-size: 11px; font-weight: 700; fill: var(--ink); font-family: "Atkinson Hyperlegible", sans-serif; }

.parts .pt2 { font-size: 9.5px; font-weight: 700; font-family: "Atkinson Hyperlegible", sans-serif; fill: var(--ink); }
.parts .pill.mol + .pt2 { fill: var(--surface); }
.backbar .bb-total { font-size: .85rem; color: var(--ink-2); border-bottom: 2px solid var(--ink-3); padding-bottom: 4px; margin-bottom: 6px; text-align: center; }

.bb-a { flex: 2.2; background: var(--accent); color: var(--on-accent); padding: 10px; font-weight: 700; }

@media (max-width: 560px) { .bufmech { grid-template-columns: 1fr; } .bm-mid { border-radius: 12px; } }

/* Study */
.study { max-width: 860px; margin: 0 auto; padding: clamp(12px, 3vw, 28px) clamp(10px, 3vw, 28px) 40px; display: flex; flex-direction: column; gap: 12px; }
.study-h { display: flex; align-items: center; gap: 12px; }
.sh-mid { flex: 1; min-width: 0; }
.sh-t { font-weight: 750; font-size: 1.15rem; line-height: 1.2; }

.sh-clock.idle #sess-clock { color: var(--ink-3); }
.sess-bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.sess-bar span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.stage { border-radius: 20px; padding: clamp(12px, 4vw, 40px); background-color: var(--paper);
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; background-position: -1px -1px; border: 1px solid var(--line); }
.flip { perspective: 1800px; cursor: pointer; outline: none; display: block; }
.flip-inner { display: grid; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2, .75, .25, 1); }

.back .ans { font-size: 1.02rem; }
.flip.enter .face { animation: cardIn .28s ease-out; }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rate { min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 72%, transparent); }
.btn-reveal { padding: 12px 26px; font-size: 1.05rem; }

.rate-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.rate-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--c); background: var(--cs); color: var(--ink); text-align: left; cursor: pointer; transition: transform .08s, background .12s; }
.rate-btn:hover { background: var(--c); color: #fff; }
.rate-btn:hover .dot { background: #fff; }
.rate-btn:active { transform: scale(.98); }
.rb-l { font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; }
.rb-s { font-size: .82rem; opacity: .85; display: flex; gap: 8px; align-items: center; }
.rb-red { --c: var(--red); --cs: var(--red-soft); } .rb-orange { --c: var(--orange); --cs: var(--orange-soft); } .rb-green { --c: var(--green); --cs: var(--green-soft); }
@media (max-width: 560px) { .rate-btn { padding: 10px 9px; } .rb-l { font-size: .9rem; } .rb-s kbd { display: none; } .hint kbd { display: none; } .sh-clock #sess-clock { font-size: 1.05rem; } }
.done h1 { font-size: 1.9rem; font-weight: 750; }

/* Modal + toast */
#modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.modal-bd { position: absolute; inset: 0; background: rgba(10,16,26,.5); }
.modal-box { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }

.modal-box p { margin: 6px 0; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font-weight: 700; }
.fld input, .ta { border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--surface-2); color: var(--ink); font: inherit; }
.ta { width: 100%; height: 96px; font-size: .78rem; margin-top: 8px; resize: vertical; }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -16px); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; display: flex; align-items: center; max-width: 92vw; }

M6_DECKS.push({ id: 'm6-en', fa: 'fa1', title: 'Enthalpy of neutralisation', dps: ['6.1.5'], cards: [
  { id: 'en01', dp: '6.1.5', t: 'con', q: 'Why are all neutralisation reactions exothermic?',
    a: L(['ΔH = enthalpy of products − enthalpy of reactants; for an exothermic reaction ΔH < 0.', 'Breaking bonds absorbs energy; making bonds releases energy.', 'Neutralisation is exothermic mainly because forming strong, stable bonds in H_2O releases more energy than it takes to break the bonds in the acid and base.']) },
  { id: 'en02', dp: '6.1.5', t: 'eq', q: 'What is the net ionic equation for a strong acid + strong base neutralisation in water?',

  { id: 'en03', dp: '6.1.5', t: 'eq', q: 'Write the full ionic and net ionic equations for HCl(aq) + NaOH(aq).',
    a: P('Full ionic equation:') + E('H^+(aq) + Cl^-(aq) + Na^+(aq) + OH^-(aq) → Na^+(aq) + Cl^-(aq) + H_2O(l)') + P('Na^+ and Cl^- are spectator ions. In water, H^+ exists as H_3O^+, so the net ionic equation is:') + E('H_3O^+(aq) + OH^-(aq) → 2H_2O(l)') },
  { id: 'en04', dp: '6.1.5', t: 'def', q: 'In q = mcΔT, what does each symbol mean, with units?',

  { id: 'en05', dp: '6.1.5', t: 'def', q: 'In ΔH = −q/n, what is each term, and why is there a minus sign?',
    a: E('ΔH = ' + F('−q', 'n')) + L(['ΔH: enthalpy of neutralisation (kJ mol^{-1})', 'q: energy absorbed by the solution, in <b>kJ</b> (convert from J)', 'n: moles of <b>water produced</b>']) + P('The minus sign is needed because q is the energy absorbed by the solution, while ΔH is the energy released by neutralisation per mole of water formed.') + N('Experimental q is always too low because of unaccounted heat loss, so experimental ΔH differs from the theoretical value.') },
  { id: 'en06', dp: '6.1.5', t: 'exam', q: 'What are the key checks when calculating an enthalpy of neutralisation in an exam?',
    a: L(['m (mass of final solution) in kg', 'c in the right units: 4.18 × 10^{3} J kg^{-1} K^{-1}', 'Initial temperature = average of the two initial temperatures', 'Write equations before substituting', 'n = moles of water: find moles of each reactant (n = cV) and use the mole ratio to identify the limiting reagent', 'ΔH = −q/n, so your answer must be negative', 'Significant figures']) },
  { id: 'en07', dp: '6.1.5', t: 'calc', q: '50 mL of 2.0 M H_2SO_4 is mixed with 50 mL of 2.0 M NaOH. The temperature rises from 21.3 °C to 34.9 °C. Calculate q and ΔH (density 1 g mL^{-1}).',
    a: L(['ΔT = 34.9 − 21.3 = 13.6 K; V = 100 mL, so m = 0.100 kg', 'q = 0.100 × 4.18 × 10^{3} × 13.6 = 5684.8 J = 5.68 kJ', 'n(H_2SO_4) = n(NaOH) = 2.0 × 0.050 = 0.10 mol', 'H_2SO_4 + 2NaOH → Na_2SO_4 + 2H_2O: 1 : 2 ratio, so <b>NaOH is limiting</b>', 'n(H_2O) = n(NaOH) = 0.10 mol', 'ΔH = −5.6848 ÷ 0.10 = <b>−57 kJ mol^{-1}</b>']) + N('Sulfuric acid is diprotic, but there wasn’t enough NaOH to fully neutralise it. Theoretical value ≈ −57 kJ mol^{-1}.') },
  { id: 'en08', dp: '6.1.5', t: 'con', q: 'Why do strong acid + strong base neutralisations all have a very similar ΔH?',
    a: L(['Strong acids and bases fully dissociate, so OH^- and H^+ (H_3O^+) are already in solution.', 'Some energy is needed to overcome ion–water attractions, but more is released as bonds form in water, so the reaction is exothermic.', 'Every combination is the same net reaction, so ΔH ≈ −57 kJ mol^{-1} (e.g. NaOH + HNO_3: −57.3 kJ mol^{-1}).']) },
  { id: 'en09', dp: '6.1.5', t: 'con', q: 'Why is ΔH smaller (less negative) when a weak acid or weak base is neutralised?',
    a: L(['Weak acids and bases don’t fully dissociate.', 'Energy is required to ionise the weak acid or base.', 'So the overall reaction is not as exothermic.']) + P('Slide examples: strong base + weak acid, ΔH = −56.1 kJ mol^{-1}; strong base + very weak acid, ΔH = −11.7 kJ mol^{-1}.') },
  { id: 'en10', dp: '6.1.5', t: 'prac', q: 'Why is a Styrofoam cup used as the calorimeter instead of a metal container?',
    a: L(['Styrofoam is an insulator and absorbs only a small amount of heat from the system.', 'A metal container would absorb more heat, reducing the measured temperature change and giving a smaller calculated q.']) + N('Safety: wear goggles (acid and base are corrosive) and stir carefully so you don’t puncture the cup.') },
  { id: 'en11', dp: '6.1.5', t: 'con', q: 'Why does the amount of heat released depend on the limiting reagent?',
    a: P('Heat released depends on how many moles of reactants are converted to water. One reactant is usually limiting and the other is in excess, so the limiting reagent decides how many moles of water form, and therefore how much heat is released.') },
  { id: 'en12', dp: '6.1.5', t: 'exam', q: '2022 HSC: 100.0 mL of 0.50 M HCl was mixed with 100.0 mL of 0.50 M NaOH. A student found 2.6 × 10^{3} J of heat was released. Find ΔH in kJ mol^{-1}.',

]});

M6_DECKS.push({ id: 'm6-sc', fa: 'fa2', title: 'Strength, conjugates and amphiprotic species', dps: ['6.2.3', '6.2.4', '6.2.5'], cards: [

    a: L(['Every atom, including hydrogens, and every bond individually, in 2D: enough to name the compound.', 'Bonds inside polyatomic groups (–OH, –NH_2) aren’t always drawn.', 'When relating structure to physical properties, show all bonds. When in doubt, show all bonds.']) },
  { id: 'orp02', dp: '7.1.1', t: 'def', q: 'What are the rules for reading a skeletal formula?',
    a: L(['Carbons and hydrogens are inferred; all other atoms are shown.', 'A corner with no symbol is a carbon.', 'The end of a double or triple bond is a carbon, even with no bend.', 'Carbon always forms four bonds, so a terminal carbon has 3 hydrogens.']) },
  { id: 'orp03', dp: '7.1.1', t: 'def', q: 'What is a condensed structural formula? Give the rules for writing one.',
    a: L(['Also called semi-structural: shows how atoms connect along the carbon backbone, e.g. 2-bromopropane is CH_3CHBrCH_3.', 'Draw the full structural formula first.', 'Write the longest chain first, with functional groups towards the end.', 'Put side chains in brackets after the carbon they’re attached to.', 'Write aldehydes as CHO (not COH) so they aren’t confused with an alcohol.']) + P('E.g. butanal is CH_3CH_2CH_2CHO.') },
  { id: 'orp04', dp: '7.1.1', t: 'def', q: 'What is a homologous series, and what does a general structural formula show?',
    a: L(['A homologous series is a group of organic compounds with the <b>same functional group</b> and similar chemical properties (e.g. the alcohols).', 'A general structural formula uses <b>R</b> for the rest of the molecule, e.g. R–X for haloalkanes, R–OH for alcohols.', 'Molecular and empirical formulae are also used: 2-bromopropane is C_3H_7Br for both.']) },
  { id: 'orp05', dp: '7.1.2', t: 'def', q: 'What are isomers? Name the three main categories.',
    a: P('Compounds with the <b>same molecular formula</b> but different structural formulae.') + L(['<b>Structural</b>: different organisation of atoms and bonds (e.g. propan-1-ol and propan-2-ol). The only type in the HSC.', '<b>Geometrical</b>: same bonding, different arrangement in space (cis- and trans-but-2-ene).', '<b>Configurational/optical</b>: same bonding, arranged as non-superimposable mirror images.']) },
  { id: 'orp06', dp: '7.1.2', t: 'def', q: 'Name and describe the three types of structural isomer, with examples.',
    a: L(['<b>Chain</b>: the carbon chain arrangement differs, e.g. hexane, 2-methylpentane, 3-methylpentane.', '<b>Position</b>: same functional group in a different position, e.g. but-1-yne and but-2-yne.', '<b>Functional group</b>: different functional groups, e.g. propanal and propanone (aldehydes/ketones; also carboxylic acids/esters).']) },
  { id: 'orp07', dp: '7.1.2', t: 'con', q: 'Classify each pair: (a) propan-1-ol and propan-2-ol (b) propanal and propanone (c) hexane and 2-methylpentane',
    a: L(['(a) <b>position</b> isomers', '(b) <b>functional group</b> isomers', '(c) <b>chain</b> isomers']) },
  { id: 'orp08', dp: '7.1.1', t: 'con', q: 'Why is ‘N-ethylpropanamine’ not a valid name?',
    a: P('The amine needs a locant because propane has 3 carbons. It should be <b>N-ethylpropan-1-amine</b>.') },
  { id: 'orp09', dp: '7.1.2', t: 'rec', q: 'What is the smallest stable carbon ring?',
    a: P('Three- or four-carbon rings are inherently unstable; the smallest stable ring has <b>five</b> carbons.') }
]});

M7_DECKS.push({ id: 'm7-hc', fa: 'fa2', title: 'Hydrocarbons: structure, shape and properties', dps: ['7.2.1', '7.2.2', '7.2.3', '7.2.4'], cards: [
  { id: 'ohc01', dp: '7.2.1', t: 'def', q: 'What are aliphatic and aromatic hydrocarbons?',
    a: L(['<b>Aliphatic</b>: the alkane, alkene and alkyne homologous series.', '<b>Aromatic</b>: contain at least one benzene ring, which changes their properties substantially. Aromatic chemistry is outside the HSC course.']) },
  { id: 'ohc02', dp: '7.2.1', t: 'rec', q: 'What are the general formulae of alkanes, alkenes and alkynes? What are the common names (PINs) of ethene and ethyne?',
    a: L(['Alkanes C_{n}H_{2n+2}; alkenes C_{n}H_{2n}; alkynes C_{n}H_{2n−2}', 'Ethene = <b>ethylene</b>; ethyne = <b>acetylene</b>. Know both names.']) },
  { id: 'ohc03', dp: '7.2.1', t: 'calc', q: 'Name each and identify its functional group: (a) (CH_3)_2C=C(CH_3)_2 (b) CH≡CCH(CH_3)CH_3 (c) CH_3CH_2CH(CH_3)CH_2CH_2CH_3',
    a: L(['(a) <b>2,3-dimethylbut-2-ene</b>: double bond', '(b) <b>3-methylbut-1-yne</b>: triple bond', '(c) <b>3-methylhexane</b>: no functional group']) },
  { id: 'ohc04', dp: '7.2.3', t: 'con', q: 'What does VSEPR theory say, and how does it apply to carbon?',
    a: L(['Valence electron pairs around an atom arrange themselves as far apart as possible, which sets the shape.', 'Carbon forms four covalent bonds; how its four shared pairs spread out sets the shape and bond angles.', 'E.g. methane is tetrahedral, 109.5°.']) },
  { id: 'ohc05', dp: '7.2.3', t: 'con', q: 'Compare the shape around carbon in alkanes, alkenes and alkynes.',
    a: L(['<b>Alkane</b> (single bonds): 4 electron domains, <b>tetrahedral, 109.5°</b>; free rotation around bonds.', '<b>Alkene</b> (C=C): 3 domains, <b>trigonal planar, 120°</b>; the double bond doesn’t allow free rotation.', '<b>Alkyne</b> (C≡C): 2 domains, <b>linear, 180°</b>.']), v: 'img:m7_shapes' },
  { id: 'ohc06', dp: '7.2.3', t: 'con', q: 'Why are double and triple C–C bonds more reactive, not ‘stronger’? (sigma and pi bonds)',
    a: L(['<b>Sigma (σ)</b> bonds: direct head-on orbital overlap; strong. All single bonds are sigma bonds.', '<b>Pi (π)</b> bonds: side-by-side overlap of p orbitals; weaker. Only in double and triple bonds.', 'So double and triple bonds are more susceptible to chemical attack.']) },
  { id: 'ohc07', dp: '7.2.4', t: 'rec', q: 'Describe the three types of intermolecular force and their relative strength.',
    a: L(['<b>Dispersion</b>: temporary dipoles; in all molecules; larger molecules (more electrons) = stronger. Strength 0.1–1.', '<b>Dipole–dipole</b>: permanent dipoles in polar molecules (polar bonds + asymmetry). Strength 1–3.', '<b>Hydrogen bonding</b>: H bonded to O, N or F attracted to a lone pair on another O, N or F. Strength about 10.']) + N('Strengths are relative to a covalent bond set at 100.') },
  { id: 'ohc08', dp: '7.2.4', t: 'con', q: 'Why are alkanes non-polar, and which intermolecular force do they have?',
    a: L(['Each carbon bonds to four atoms, so alkanes are <b>saturated</b>, held together by covalent bonds.', 'C and H have similar electronegativity, so all bonds are non-polar and the molecules are non-polar.', 'So only <b>dispersion forces</b> act between alkane molecules.']) },
  { id: 'ohc09', dp: '7.2.4', t: 'con', q: 'What general physical properties do alkanes have, and why?',
    a: P('Only weak dispersion forces, so:') + L(['low melting and boiling points', 'volatile', 'low hardness and low density', 'poor solubility in water', 'poor electrical conductivity (no free charges in covalent substances)']) },
  { id: 'ohc10', dp: '7.2.4', t: 'con', q: 'How do alkane properties change as chain length increases?',
    a: P('Larger molecules have more electrons, so stronger dispersion forces:') + L(['melting and boiling points increase', 'volatility decreases', 'hardness and density increase']) + P('Boiling points: methane −161.5 °C, ethane −88.6 °C, propane −42.1 °C, butane −0.5 °C.') },
  { id: 'ohc11', dp: '7.2.4', t: 'con', q: 'Why does a branched alkane boil at a lower temperature than a straight-chain isomer?',
    a: P('Branching makes the molecule more compact, reducing surface area and preventing close packing. Dispersion forces are weaker, so melting and boiling points are slightly lower than for a linear alkane of the same molar mass.') },
  { id: 'ohc12', dp: '7.2.4', t: 'con', q: 'Why are alkanes insoluble in water?',
    a: P('A substance dissolves if its intermolecular forces are similar to the solvent’s (‘like dissolves like’). Water is polar with hydrogen bonding; alkanes are non-polar, so they can’t form strong attractions with water molecules.') },
  { id: 'ohc13', dp: '7.2.2', t: 'prac', q: 'Prac 7.1: Describe and explain the trend in water solubility of the alcohols.',
    a: P('Solubility at 20 °C: methanol, ethanol and propan-1-ol mix completely; butanol 77 g/L; pentanol 22; hexanol 5.9; heptanol 1.0; octanol 0.0.') + P('As the chain gets longer, the non-polar ‘hydrophobic’ part grows and interferes with water, so the alcohol can’t form enough hydrogen bonds to dissolve.') },
  { id: 'ohc14', dp: '7.2.1', t: 'rec', q: 'What state are alkanes, alkenes and alkynes at room temperature?',
    a: L(['4 or fewer backbone carbons: <b>gases</b>', 'Between 5 and about 15 carbons: <b>liquids</b>']) }
]});

M7_DECKS.push({ id: 'm7-sf', fa: 'fa2', title: 'Safety and implications of hydrocarbons', dps: ['7.2.5', '7.2.6'], cards: [
  { id: 'osf01', dp: '7.2.5', t: 'con', q: 'What hazards do organic compounds pose?',
    a: L(['Irritants (skin, eyes, respiratory surfaces)', 'Toxic, by skin contact and/or inhalation', 'Corrosive', 'Immiscible with water', 'Carcinogenic, usually after long-term exposure', 'Most are <b>highly flammable</b>']) },
  { id: 'osf02', dp: '7.2.5', t: 'def', q: 'Define flash point and ignition temperature.',
    a: L(['<b>Flash point</b>: the minimum temperature at which a liquid gives off enough vapour to form an ignitable mixture with air.', '<b>Ignition temperature</b>: the minimum temperature needed to start self-sustained combustion without a heat source.']) },
  { id: 'osf03', dp: '7.2.5', t: 'con', q: 'In what order should risk minimisations be developed? What is an SDS?',
    a: OL(['<b>Avoidance</b>: is the material or experiment needed; is there an alternative?', '<b>Safe handling</b>: minimal quantities, dispensing equipment, no flames or sparks, fume hood, ventilation, waste disposal.', '<b>PPE</b>: safety glasses, enclosed leather shoes, gloves.', '<b>Spill/accident protocols</b>.']) + P('A Safety Data Sheet (SDS) is legally required for every material. It summarises health and safety information and how to handle, store and use it safely.') },
  { id: 'osf04', dp: '7.2.5', t: 'con', q: 'Using cyclohexane’s properties, justify the safety precautions it needs.',
    a: L(['Low boiling point → high volatility → good ventilation', 'High vapour production → inhalation hazard → PPE', 'Weak intermolecular forces → highly flammable → strict ignition control', 'Low polarity → poor miscibility with water → spills spread over surfaces']) },
  { id: 'osf05', dp: '7.2.5', t: 'prac', q: 'Prac 7.2: What safety measures are used when reacting hydrocarbons with bromine water?',
    a: L(['Nitrile gloves, enclosed shoes, safety glasses; eliminate ignition sources', 'Dispense chemicals in the fume hood; ensure ventilation', 'Collect organic waste; never pour it down the sink', 'Manage spills immediately; for skin or eye contact, rinse with copious water']) },
  { id: 'osf06', dp: '7.2.6', t: 'con', q: 'Outline key implications of obtaining and using hydrocarbons.',
    a: L(['Hydrocarbons come mainly from crude oil or natural gas, which is mined and split into components by fractional distillation.', 'Mining and transport can have major environmental, economic and sociocultural impacts when accidents occur.', 'CO_2 from combustion is a significant contributor to the enhanced greenhouse effect (climate, sea levels, sea ice, severe weather) and to ocean acidity.', 'Polymers made from hydrocarbons cause pollution and waste.']) }
]});

M7_DECKS.push({ id: 'm7-rx', fa: 'fa3', title: 'Reactions of hydrocarbons', dps: ['7.3.1', '7.3.2'], cards: [
  { id: 'orx01', dp: '7.3.1', t: 'con', q: 'Why do unsaturated hydrocarbons undergo addition reactions?',
    a: L(['Double and triple bonds are regions of high electron density.', 'Electrophiles (e.g. halogens) are attracted and break the weaker pi bond.', 'Only the sigma bond is left joining the carbons, giving a saturated molecule.', 'The reagent ‘adds across’ the carbons either side of the multiple bond.']) },
  { id: 'orx02', dp: '7.3.1', t: 'rec', q: 'Name the addition reactions of ethylene with H_2, X_2, HX and H_2O.',
    a: L(['+ H_2: <b>hydrogenation</b>', '+ X_2: <b>halogenation</b>', '+ HX: <b>hydrohalogenation</b>', '+ H_2O: <b>hydration</b>', '+ more CH_2=CH_2: addition polymerisation']), v: 'img:m7_addition' },
  { id: 'orx03', dp: '7.3.1', t: 'eq', q: 'Describe hydrogenation, with an equation and conditions.',
    a: E('CH_2=CH_2 + H_2 → CH_3CH_3') + L(['One H atom joins each carbon of the double bond, converting the alkene into an alkane.', 'Needs a metal catalyst: <b>Pt or Ni</b>.', 'Used to make margarine: liquid unsaturated fats become solid saturated fats.']) },
  { id: 'orx04', dp: '7.3.1', t: 'eq', q: 'Describe halogenation of an alkene, with an equation and conditions.',
    a: E('CH_2=CH_2 + Br_2 → CH_2BrCH_2Br') + L(['A diatomic halogen adds across the double bond to form a haloalkane (here 1,2-dibromoethane).', 'Halogens are strongly electrophilic, so <b>no catalyst or heat</b> is needed.']) },
  { id: 'orx05', dp: '7.3.1', t: 'prac', q: 'How does the bromine water test distinguish alkanes from alkenes?',
    a: L(['<b>Alkene</b> (or alkyne): bromine water <b>decolourises quickly</b> (addition reaction).', '<b>Alkane</b>: no change, stays brown; decolourises only slowly with UV light (substitution).']), v: 'img:m7_brwater' },
  { id: 'orx06', dp: '7.3.1', t: 'eq', q: 'Describe hydrohalogenation, with an example.',
    a: E('CH_2=CH_2 + HCl → CH_3CH_2Cl') + P('A hydrogen halide (HF, HCl, HBr, HI) adds across the double bond to form a haloalkane.') },
  { id: 'orx07', dp: '7.3.1', t: 'def', q: 'State Markovnikov’s rule and predict the products of propene + HBr.',
    a: P('When adding across a double or triple bond, the <b>hydrogen</b> attaches preferentially to the carbon that already has <b>the most hydrogens</b> (‘the rich get richer’). Used when the reagent can’t split into two identical parts.') + L(['Major product: <b>2-bromopropane</b>', 'Minor product: 1-bromopropane']), v: 'img:m7_markov' },
  { id: 'orx08', dp: '7.3.1', t: 'eq', q: 'Describe hydration of an alkene. What forms from propene?',
    a: E('CH_2=CH_2 + H_2O → CH_3CH_2OH') + L(['Water adds across the double bond to give an alcohol; dilute H_2SO_4 is used as the acid catalyst.', 'For asymmetric alkenes, Markovnikov’s rule applies: propene gives <b>propan-2-ol</b> (major) and propan-1-ol (minor).']) },
  { id: 'orx09', dp: '7.3.1', t: 'eq', q: 'How does an alkyne react with bromine?',
    a: E('CH≡CH + Br_2 → CHBr=CHBr') + E('CHBr=CHBr + Br_2 → CHBr_2CHBr_2') + P('Addition gives a dibromoalkene, then further addition can give a tetrabromoalkane.') },
  { id: 'orx10', dp: '7.3.2', t: 'def', q: 'What is a substitution reaction, and what conditions does an alkane need?',
    a: L(['An atom or functional group in a molecule is replaced by a different one.', 'Most common in alkanes; unsaturated molecules generally undergo addition instead.', 'Alkane + halogen needs <b>UV light</b> (or high temperature).']) + E('CH_4 + Cl_2 → CH_3Cl + HCl (UV light)') },
  { id: 'orx11', dp: '7.3.2', t: 'con', q: 'Outline the three-step mechanism of alkane substitution with chlorine.',
    a: OL(['UV light breaks Cl–Cl, forming two chlorine <b>radicals</b> (Cl•). A radical is an atom with an unpaired electron, not an ion: highly reactive.', 'A Cl• rips an H atom off the alkane, forming HCl and an alkyl radical.', 'A second Cl• combines with the alkyl radical, forming the haloalkane.']), v: 'img:m7_mechanism' },
  { id: 'orx12', dp: '7.3.2', t: 'con', q: 'Why does alkane substitution give a mixture of products? What should you assume in exams?',
    a: P('Given enough halogen and time, every hydrogen can be replaced, giving a mixture of haloalkanes (including position isomers for longer alkanes).') + N('In exams, assume a single substitution unless the question asks for more.') },
  { id: 'orx13', dp: '7.3.2', t: 'con', q: 'Compare how alkanes and alkenes react with halogens.',
    a: L(['<b>Alkene + X_2</b>: addition (halogenation); no catalyst or heat; one product.', '<b>Alkane + X_2</b>: substitution; needs UV light or high temperature; also produces HX.']) },
  { id: 'orx14', dp: '7.3.2', t: 'eq', q: 'Write equations for complete and incomplete combustion of propane.',
    a: E('C_3H_8(g) + 5O_2(g) → 3CO_2(g) + 4H_2O(g)') + P('Complete combustion.') + E('C_3H_8(g) + 4O_2(g) → CO_2(g) + 2CO(g) + 4H_2O(g)') + P('Limited oxygen.') + E('C_3H_8(g) + 3O_2(g) → 2CO(g) + C(s) + 4H_2O(g)') + P('Very limited oxygen.') + N('All combustions are exothermic and water is always a product. There’s no single correct incomplete equation unless mole ratios are given, but it must balance.') },
  { id: 'orx15', dp: '7.3.2', t: 'rec', q: 'What conventions do HSC examiners expect in combustion equations?',
    a: L(['Write the fuel in its state at 25 °C.', 'Write water as a gas, <b>unless</b> the equation shows the molar enthalpy of combustion; then water is liquid.', 'An improper fraction is allowed for the O_2 mole ratio.', 'A thermochemical equation shows ΔH (always negative) to the right:']) + E('C_5H_12(l) + 8O_2(g) → 5CO_2(g) + 6H_2O(l)   ΔH = −3535 kJ mol^{-1}') }
]});

M7_DECKS.push({ id: 'm7-al', fa: 'fa4', title: 'Alcohols: structure and properties', dps: ['7.4.1', '7.4.2'], cards: [
  { id: 'oal01', dp: '7.4.1', t: 'def', q: 'What is the functional group of an alcohol? How is it different from the hydroxide ion?',
    a: L(['The <b>hydroxyl group</b>, –OH, covalently bonded to carbon. It is uncharged.', 'The hydroxide ion, OH^-, is a charged polyatomic ion.', 'The O–H bond is polar (large electronegativity difference), which affects alcohols’ physical properties.']) },
  { id: 'oal02', dp: '7.4.1', t: 'def', q: 'Define primary, secondary and tertiary alcohols, with an example of each.',
    a: L(['<b>Primary (1°)</b>: the C bearing –OH is bonded to at most one R group, so –OH is terminal. E.g. butan-1-ol.', '<b>Secondary (2°)</b>: that C is bonded to two R groups. E.g. butan-2-ol.', '<b>Tertiary (3°)</b>: that C is bonded to three R groups. E.g. 2-methylpropan-2-ol.']) + N('R = an alkyl group.'), v: 'img:m7_alctypes' },
  { id: 'oal03', dp: '7.4.1', t: 'con', q: 'Classify as 1°, 2° or 3°: ethanol, propan-2-ol, 2-methylbutan-2-ol, pentan-3-ol.',
    a: L(['ethanol: <b>primary</b>', 'propan-2-ol: <b>secondary</b>', '2-methylbutan-2-ol: <b>tertiary</b>', 'pentan-3-ol: <b>secondary</b>']) },
  { id: 'oal04', dp: '7.4.2', t: 'con', q: 'Which intermolecular forces act between alcohol molecules, and which dominates?',
    a: L(['<b>Dispersion</b> forces, as in all molecules.', '<b>Dipole–dipole</b>: two polar bonds (C–O and O–H) and an asymmetrical shape give a permanent dipole.', '<b>Hydrogen bonding</b>: H is directly bonded to O.', 'Hydrogen bonding, the strongest, dominates their physical properties.']) },
  { id: 'oal05', dp: '7.4.2', t: 'con', q: 'How do the boiling points of alcohols change with chain length and number of –OH groups?',
    a: L(['Longer chain → larger molecule → stronger dispersion forces → higher melting and boiling points. (The melting point trend is less clear, because it depends on shape and crystal packing.)', 'More –OH groups → more hydrogen bonding → higher melting and boiling points.']) },
  { id: 'oal06', dp: '7.4.2', t: 'con', q: 'How do the boiling points of primary, secondary and tertiary alcohols compare?',
    a: L(['The more ‘exposed’ the –OH, the more it can hydrogen bond with other –OH groups.', 'So boiling point: <b>primary > secondary > tertiary</b> (differences are subtle).', 'Melting points can be anomalous: symmetrical 2-methylpropan-2-ol forms a very stable crystal lattice, so it has a high melting point.']) },
  { id: 'oal07', dp: '7.4.2', t: 'con', q: 'What decides an alcohol’s solubility in water? How many carbons can a water-soluble alcohol have?',
    a: L(['Solubility depends on solvent–solvent (water H-bonds), solute–solute (dispersion + H-bonds) and solute–solvent (H-bonds) interactions.', 'It depends on the proportions of the molecule that are polar and non-polar; a longer chain is more non-polar.', 'Alcohols up to <b>C3</b> are water-soluble (miscible); above that solubility drops rapidly, and they dissolve better in non-polar solvents like toluene or kerosene.']) + N('Miscible: solvent and solute combine completely in any proportion.') },
  { id: 'oal08', dp: '7.4.2', t: 'con', q: 'Compare the boiling points of pentane (72 g/mol), butan-1-amine (73 g/mol) and butan-1-ol (74 g/mol), and explain.',
    a: L(['Pentane 36 °C: dispersion forces only.', 'Butan-1-amine 78 °C: N–H bonds allow hydrogen bonding.', 'Butan-1-ol 118 °C: O is more electronegative than N, so O–H hydrogen bonds are stronger.']) }
]});

M7_DECKS.push({ id: 'm7-ar', fa: 'fa4', title: 'Reactions and production of alcohols', dps: ['7.4.4', '7.4.5', '7.4.7'], cards: [
  { id: 'oar01', dp: '7.4.4', t: 'eq', q: 'Why are alcohols good fuels? Write the equation for complete combustion of ethanol.',
    a: E('C_2H_5OH(l) + 3O_2(g) → 2CO_2(g) + 3H_2O(g)') + L(['High bond energy of C–C and C–H bonds makes them excellent fuels.', 'The oxygen atom in the alcohol helps combustion be more complete (‘cleaner’) than for alkanes, alkenes and alkynes.']) },
  { id: 'oar02', dp: '7.4.4', t: 'eq', q: 'Write the thermochemical equation for the combustion of butan-1-ol (ΔH_{c} = −2644 kJ mol^{-1}).',
    a: E('C_4H_9OH(l) + 6O_2(g) → 4CO_2(g) + 5H_2O(l)   ΔH = −2644 kJ mol^{-1}') + N('For a molar enthalpy of combustion, write water as a liquid (its state at 25 °C).') },
  { id: 'oar03', dp: '7.4.4', t: 'def', q: 'How do you calculate the molar enthalpy of combustion from calorimetry data?',
    a: E('q = mcΔT') + L(['q = heat released (J); m = mass of <b>water</b> (kg); c = 4.18 × 10^{3} J kg^{-1} K^{-1}; ΔT = temperature change of the water (K)']) + E('ΔH_{c} = ' + F('−q', 'n')) + L(['n = moles of fuel burned (from the mass lost by the burner)', 'ΔH_{c} is always negative: combustion is exothermic', 'Standard conditions: 25 °C and 100 kPa']) },
  { id: 'oar04', dp: '7.4.4', t: 'calc', q: 'A methanol burner went from 80.55 g to 80.03 g, heating 20.00 g of water from 19.5 °C to 56.3 °C. Calculate ΔH_{c} of methanol.',
    a: L(['m(CH_3OH) burned = 80.55 − 80.03 = 0.52 g; n = 0.52 ÷ 32.04 = 0.0162 mol', 'q = 0.02000 × 4.18 × 10^{3} × 36.8 = 3076 J = 3.076 kJ', 'ΔH_{c} = −3.076 ÷ 0.0162 = <b>−190 kJ mol^{-1}</b> (slide: −189.570)']) + N('The theoretical value is −727 kJ mol^{-1}: see the next card for why it’s so different.') },
  { id: 'oar05', dp: '7.4.4', t: 'con', q: 'What does calorimetry assume, and how can a spirit burner experiment be made more valid?',
    a: P('Assumes complete combustion, and that all the energy released goes into the water.') + L(['Maximise oxygen: trim wicks; keep a suitable distance between flame and calorimeter.', 'Minimise heat loss: lid on the calorimeter; draught shield; insulate the sides; keep the base clean (soot insulates) and dry.', 'A bomb calorimeter (sample in oxygen, electrical ignition, water jacket) addresses all of these.']) },
  { id: 'oar06', dp: '7.4.4', t: 'con', q: 'Why are experimental enthalpies of combustion lower than theoretical values?',
    a: L(['Heat lost to the surroundings rather than the water', 'Incomplete combustion from limited oxygen or a poor burner set-up', 'Alcohol not fully vaporised before burning', 'Impurities in the fuel', 'Evaporation of alcohol before ignition']) },
  { id: 'oar07', dp: '7.4.4', t: 'eq', q: 'Describe the dehydration of an alcohol, with an equation and conditions.',

function vizImg(key) {

/* --- Titration chemistry: solve the charge balance for [H+] --- */
const KW_ = 1e-14;
function solvePH(Ca, acidKa, Cb, baseKb) {
  const f = h => {
    const A = acidKa === Infinity ? Ca : Ca * acidKa / (acidKa + h);
    const BH = baseKb === Infinity ? Cb : Cb * h / (h + KW_ / baseKb);
    return h + BH - KW_ / h - A;
  };
  let lo = -16, hi = 2;
  for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (f(10 ** m) > 0) hi = m; else lo = m; }
  return -(lo + hi) / 2;
}
function titration({ acidC, acidKa, baseC, baseKb, flask, V0 = 25, Vmax = 50 }) {
  const veq = flask === 'base' ? V0 * baseC / acidC : V0 * acidC / baseC;
  const vs = [];
  for (let i = 0; i <= 160; i++) vs.push(Vmax * i / 160);
  for (let d = -1.2; d <= 1.2; d += 0.03) vs.push(veq + d);
  vs.sort((a, b) => a - b);
  const pts = vs.filter(v => v >= 0 && v <= Vmax).map(v => {
    const Vt = V0 + v;
    const na = flask === 'base' ? acidC * v : acidC * V0;
    const nb = flask === 'base' ? baseC * V0 : baseC * v;
    return [v, solvePH(na / Vt, acidKa, nb / Vt, baseKb)];
  });
  return { pts, veq, phAt: v => { const Vt = V0 + v; const na = flask === 'base' ? acidC * v : acidC * V0; const nb = flask === 'base' ? baseC * V0 : baseC * v; return solvePH(na / Vt, acidKa, nb / Vt, baseKb); } };
}

/* --- Generic SVG line chart --- */
function chart(o) {
  const w = o.w || 360, h = o.h || 230, L = o.L || 38, R = 14, T = 12, B = 38;
  const xMax = o.xMax, yMax = o.yMax ?? 14, pw = w - L - R, ph = h - T - B;
  const X = x => (L + x / xMax * pw).toFixed(1), Y = y => (T + (1 - y / yMax) * ph).toFixed(1);
  let s = `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${o.title}"><title>${o.title}</title>`;
  for (let i = 0; i <= 10; i++) { const x = L + i * pw / 10; s += `<line class="gl" x1="${x}" x2="${x}" y1="${T}" y2="${T + ph}"/>`; }
  const ySteps = o.ySteps || 7;
  for (let j = 0; j <= ySteps; j++) { const y = T + j * ph / ySteps; s += `<line class="gl" x1="${L}" x2="${L + pw}" y1="${y}" y2="${y}"/>`; }
  (o.shade || []).forEach(b => { s += `<rect class="shade" x="${X(b.x0)}" y="${T}" width="${(X(b.x1) - X(b.x0)).toFixed(1)}" height="${ph}"/><text class="lbl" x="${((+X(b.x0) + +X(b.x1)) / 2).toFixed(1)}" y="${T + 12}" text-anchor="middle">${b.label}</text>`; });
  (o.bands || []).forEach(b => { s += `<rect class="band ${b.cls}" x="${L}" y="${Y(b.hi)}" width="${pw}" height="${(Y(b.lo) - Y(b.hi)).toFixed(1)}"/><text class="lbl band-lbl" x="${L + pw - 4}" y="${(+Y(b.hi) + +Y(b.lo)) / 2 + 3.5}" text-anchor="end">${b.label}</text>`; });
  (o.guides || []).forEach(g => {
    if (g.x !== undefined) s += `<line class="guide" x1="${X(g.x)}" x2="${X(g.x)}" y1="${g.y !== undefined ? Y(g.y) : T}" y2="${T + ph}"/>`;

  (o.yTicks || []).forEach(t => { s += `<text class="tk" x="${L - 5}" y="${+Y(t) + 3.5}" text-anchor="end">${t}</text>`; });
  (o.xTicks || []).forEach(t => { s += `<text class="tk" x="${X(t)}" y="${T + ph + 13}" text-anchor="middle">${t}</text>`; });
  s += `<text class="axl" x="${L + pw / 2}" y="${h - 6}" text-anchor="middle">${o.xLabel}</text>`;
  s += `<text class="axl" transform="translate(11 ${T + ph / 2}) rotate(-90)" text-anchor="middle">${o.yLabel ?? 'pH'}</text>`;
  (o.series || []).forEach(ser => { s += `<path class="curve ${ser.cls || ''}" d="M${ser.pts.map(p => X(p[0]) + ' ' + Y(Math.max(0, Math.min(yMax, p[1])))).join(' L')}"/>`; });

const SA = Infinity, KA_ACETIC = 1.8e-5, KB_NH3 = 1.8e-5;
function phCurve(kind, opts = {}) {
  // acid added to base (as in the slides), 1 M each, 25 mL in flask
  const spec = {
    sasb: { acidKa: SA, baseKb: SA }, sawb: { acidKa: SA, baseKb: KB_NH3 },
    wasb: { acidKa: KA_ACETIC, baseKb: SA }, wawb: { acidKa: KA_ACETIC, baseKb: KB_NH3 }
  }[kind];
  const t = titration({ acidC: 1, baseC: 1, flask: 'base', ...spec });
  const eqpH = t.phAt(t.veq);
  return chart({
    title: opts.title || 'Titration curve', xMax: 50, xLabel: 'Volume of acid added (mL)', yTicks: [0, 7, 14], xTicks: [0, 25, 50],
    series: [{ pts: t.pts }], guides: [{ x: t.veq, y: eqpH }], bands: opts.bands || [],

}

function curves4() {

  return `<div class="viz grid grid-cols-2 gap-2">${combos.map(([name, ka, kb]) => {
    const t = titration({ acidC: 0.1, baseC: 0.1, acidKa: ka, baseKb: kb, flask: 'acid' });
    return `<div><div class="mini-t">${name}</div>${chart({ title: name + ', base added to acid', w: 200, h: 150, L: 26, xMax: 50, xLabel: 'Base added (mL)', yTicks: [0, 7, 14], series: [{ pts: t.pts }], guides: [{ x: t.veq, y: t.phAt(t.veq) }] })}</div>`;

function curveBuffer() {

    shade: [{ x0: 3, x1: 22, label: 'buffer region' }], series: [{ pts: t.pts }],

    marks: [{ x: 12.5, y: pKa, label: `half-equivalence: pH = pKa ≈ ${pKa.toFixed(2)}`, dx: 6, dy: 22 }, { x: 25, y: t.phAt(25), label: 'equivalence', dx: 8, dy: 4 }] })}</div>`;

function beaker(x, y, w, h, items, label, sub) {

}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    .replace(/\^\{([^}]*)\}/g, (m, g) => '<sup>' + g.replace(/-/g, '−') + '</sup>')

const MIN = 60000, DAY = 86400000;

const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const daysBetween = (a, b) => Math.round((sod(b) - sod(a)) / DAY);

/* ===================== STORAGE ===================== */
const STORE_KEY = 'hsc-flashcards-v1';
let storageOK = true;
try { localStorage.setItem('__hsc_t', '1'); localStorage.removeItem('__hsc_t'); } catch (e) { storageOK = false; }
/* Each device keeps its own study-time bucket so time from several devices adds up instead of overwriting. */
const DEVICE = (() => { try { let d = localStorage.getItem('hsc-device-id'); if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); localStorage.setItem('hsc-device-id', d); } return d; } catch (e) { return 'd' + Math.random().toString(36).slice(2, 10); } })();
const emptyBucket = () => ({ seq: 0, time: { total: 0, subj: {}, mod: {}, deck: {}, day: {} }, rev: { day: {} } });
/* epoch only changes on reset or restore; a newer epoch replaces older data on every device */
function freshState() { const n = Date.now(); return { v: 2, epoch: 0, createdAt: n, updatedAt: n, cards: {}, dev: {}, settings: { open: { chem: true, 'chem-m6': true } } }; }
function migrate(o) {

  const s = { ...f, ...o, cards: { ...(o.cards || {}) }, dev: { ...(o.dev || {}) }, settings: { ...f.settings, ...(o.settings || {}) } };

    const b = emptyBucket(); b.time = { ...b.time, ...(o.time || {}) }; b.rev = { day: { ...((o.rev || {}).day || {}) } }; b.seq = 1;

}
function loadState() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { } return freshState(); }

function save() { S.updatedAt = Date.now(); persist(); }
let S = loadState();
const myDev = () => (S.dev[DEVICE] = S.dev[DEVICE] || emptyBucket());
const bump = () => { myDev().seq++; };
function T() {
  const t = { total: 0, subj: {}, mod: {}, deck: {}, day: {} };
  Object.values(S.dev).forEach(b => { const x = (b && b.time) || {}; t.total += x.total || 0;
    ['subj', 'mod', 'deck', 'day'].forEach(k => Object.entries(x[k] || {}).forEach(([id, v]) => { t[k][id] = (t[k][id] || 0) + v; })); });
  return t;
}
function revDay(k) { const o = { g: 0, o: 0, r: 0 }; Object.values(S.dev).forEach(b => { const d = b && b.rev && b.rev.day && b.rev.day[k]; if (d) { o.g += d.g || 0; o.o += d.o || 0; o.r += d.r || 0; } }); return o; }

  if (!b) return a; if (!a) return b;
  if ((b.epoch || 0) > (a.epoch || 0)) return { ...b, settings: a.settings };
  if ((a.epoch || 0) > (b.epoch || 0)) return a;
  const cards = { ...a.cards };
  Object.entries(b.cards || {}).forEach(([id, r]) => { const l = cards[id]; if (r && (!l || (r.u || 0) > (l.u || 0))) cards[id] = r; });
  const dev = { ...a.dev }, rank = d => [(d && d.seq) || 0, (d && d.time && d.time.total) || 0];
  Object.entries(b.dev || {}).forEach(([id, d]) => { const l = dev[id], x = rank(d), y = rank(l); if (!l || x[0] > y[0] || (x[0] === y[0] && x[1] > y[1])) dev[id] = d; });

}
const stable = v => v && typeof v === 'object' ? (Array.isArray(v) ? '[' + v.map(stable).join(',') + ']' : '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}') : JSON.stringify(v);
const syncKey = s => stable([s.epoch || 0, s.cards || {}, s.dev || {}]);

/* Sync through the viewer's Claude account (only when opened inside Claude). Live: other devices' changes merge in as they happen. */
const Cloud = {
  ref: null, on: false, timer: null, writing: false, again: false, lastSync: 0,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/hscFlashcards');
      const remote = this.parse(await this.ref.get());
      this.absorb(remote);
      if (!remote || syncKey(remote) !== syncKey(S)) await this.push(true);
      this.on = true; this.lastSync = Date.now(); renderSaveStatus();
      this.ref.onSnapshot(snap => { if (snap.metadata && snap.metadata.hasPendingWrites) return; this.absorb(this.parse(snap)); this.lastSync = Date.now(); renderSaveStatus(); },
        () => { this.on = false; renderSaveStatus(); });
    } catch (e) { this.on = false; renderSaveStatus(); }
  },
  parse(snap) { try { return snap && snap.exists ? migrate(JSON.parse(snap.data().state)) : null; } catch (e) { return null; } },
  absorb(remote) {
    if (!remote) return;
    const before = syncKey(S), merged = mergeStates(S, remote);
    if (syncKey(merged) === before) return;
    S = merged; persist();
    if (SESSION) renderSidebar(); else render();
  },
  schedule() { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2000); },
  async push(skipRead) {
    if (!this.ref) return; if (this.writing) { this.again = true; return; }
    this.writing = true;
    try {
      if (!skipRead) this.absorb(this.parse(await this.ref.get()));
      await this.ref.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }); this.on = true; this.lastSync = Date.now();
    } catch (e) { this.on = false; }
    this.writing = false; renderSaveStatus();
    if (this.again) { this.again = false; this.push(); }
  }
};

/* ===================== SPACED REPETITION ===================== */
function nextSchedule(rec, rating, now = Date.now()) {
  rec = rec || {};
  let ease = rec.ease || 2.5, ivl = rec.ivl || 0, streak = rec.streak || 0, lapses = rec.lapses || 0;
  if (rating === 'red') return { ease: Math.max(1.3, ease - 0.2), ivl: 0, streak: 0, lapses: lapses + (rec.reps ? 1 : 0), due: now + 10 * MIN };
  if (rating === 'orange') { ivl = ivl < 1 ? 1 : Math.min(14, Math.max(1, Math.round(ivl * 1.2))); return { ease: Math.max(1.3, ease - 0.15), ivl, streak, lapses, due: addDays(now, ivl) }; }

  return { ease: Math.min(3, ease + 0.05), ivl, streak, lapses, due: addDays(now, ivl) };
}
const ivlText = (p, rating) => rating === 'red' ? '10 min' : plural(p.ivl, 'day');
function applyRating(id, rating) {
  const now = Date.now();
  const rec = S.cards[id] || { reps: 0, h: { g: 0, o: 0, r: 0 } };
  Object.assign(rec, nextSchedule(rec, rating, now));
  rec.reps = (rec.reps || 0) + 1; rec.last = now; rec.u = now; rec.s = rating; rec.h = rec.h || { g: 0, o: 0, r: 0 }; rec.h[rating[0]]++;
  S.cards[id] = rec;
  const k = dayKey(now), rd = myDev().rev.day; rd[k] = rd[k] || { g: 0, o: 0, r: 0 }; rd[k][rating[0]]++; bump();
  save(); Cloud.schedule();
  return rec;
}
const recOf = id => S.cards[id];
const statusOf = id => { const r = S.cards[id]; return r && r.reps ? r.s : 'new'; };
/* Mastery per card: unstudied 0, red 10%, orange 50%, green 75% rising to 100% after 3 successful reviews in a row. */
function mastery(r) { if (!r || !r.reps) return 0; if (r.s === 'red') return 0.1; if (r.s === 'orange') return 0.5; return Math.min(1, 0.75 + 0.125 * (Math.max(1, r.streak || 1) - 1)); }
function cardsFor(scope, id) {
  if (scope === 'all') return ALL;
  if (scope === 'subject') return ALL.filter(c => c.subject === id);
  if (scope === 'module') return ALL.filter(c => c.module === id);
  if (scope === 'deck') return IDX.decks[id] ? IDX.decks[id].cards : [];
  return [];
}
function stats(cards) {
  const now = Date.now(), end = eod(now);
  const st = { n: cards.length, g: 0, o: 0, r: 0, nw: 0, studied: 0, sum: 0, dueToday: 0, dueNow: 0, nextDue: Infinity };
  cards.forEach(c => { const r = S.cards[c.id]; st.sum += mastery(r);
    if (!r || !r.reps) { st.nw++; return; }
    st.studied++; st[{ green: 'g', orange: 'o', red: 'r' }[r.s]]++;
    if (r.due <= end) st.dueToday++; if (r.due <= now) st.dueNow++; if (r.due > end && r.due < st.nextDue) st.nextDue = r.due; });

}
const pctTxt = st => `${Math.round(st.pct)}%`;
function dueLabel(r) {

  const now = Date.now(); if (r.due <= now) return 'Due now';
  if (r.due <= eod()) { const m = Math.ceil((r.due - now) / MIN); return m < 60 ? `Due in ${m} min` : 'Due today'; }

}
function buildQueue(scope, id, mode) {
  const cards = cardsFor(scope, id), end = eod(), rank = { red: 0, orange: 1, green: 2 };
  const due = cards.filter(c => { const r = S.cards[c.id]; return r && r.reps && r.due <= end; })
    .sort((a, b) => (rank[S.cards[a.id].s] - rank[S.cards[b.id].s]) || (S.cards[a.id].due - S.cards[b.id].due));
  const fresh = cards.filter(c => !(S.cards[c.id] && S.cards[c.id].reps));

/* ===================== ACTIVE STUDY TIME ===================== */
const IDLE_MS = 3 * MIN;
const Timer = { ctx: null, last: Date.now(), lastAct: Date.now(), acc: 0, active: false };
['pointerdown', 'keydown', 'mousemove', 'wheel', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, () => { Timer.lastAct = Date.now(); }, { passive: true, capture: true }));
function addTime(ctx, dt) {
  const t = myDev().time; t.total += dt; bump();
  t.subj[ctx.s] = (t.subj[ctx.s] || 0) + dt; t.mod[ctx.m] = (t.mod[ctx.m] || 0) + dt; t.deck[ctx.d] = (t.deck[ctx.d] || 0) + dt;
  const k = dayKey(Date.now()); t.day[k] = (t.day[k] || 0) + dt;
}
setInterval(() => {
  const now = Date.now(), dt = Math.min(Math.max(0, now - Timer.last), 2000); Timer.last = now;
  if (!Timer.ctx || !SESSION) { Timer.active = false; return; }
  Timer.active = document.visibilityState === 'visible' && now - Timer.lastAct < IDLE_MS;
  if (Timer.active) { addTime(Timer.ctx, dt); SESSION.activeMs += dt; Timer.acc += dt; if (Timer.acc >= 15000) { Timer.acc = 0; save(); } }
  const el = $('#sess-clock'); if (el) { el.textContent = fmtClock(SESSION.activeMs); el.parentElement.classList.toggle('idle', !Timer.active); const lb = $('#sess-clock-lbl'); if (lb) lb.textContent = Timer.active ? 'active study time' : 'paused while idle'; }
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { save(); Cloud.push(); } else { Timer.last = Timer.lastAct = Date.now(); } });
window.addEventListener('pagehide', () => save());

/* ===================== UI PIECES ===================== */

function counts(st, withNew = true) {
  return `<span class="cnts"><span class="cnt" title="Got it"><i class="dot g"></i>${st.g}</span><span class="cnt" title="Almost there"><i class="dot o"></i>${st.o}</span><span class="cnt" title="Need review"><i class="dot r"></i>${st.r}</span>${withNew ? `<span class="cnt" title="Not studied"><i class="dot n"></i>${st.nw}</span>` : ''}</span>`;
}
function distBar(st) { const n = st.n || 1; return `<div class="dist" role="img" aria-label="${st.g} green, ${st.o} orange, ${st.r} red, ${st.nw} not studied">${['g', 'o', 'r'].map(k => st[k] ? `<span class="seg ${k}" style="width:${st[k] / n * 100}%"></span>` : '').join('')}</div>`; }

function ring(pct) { const r = 44, c = 2 * Math.PI * r; return `<svg viewBox="0 0 108 108" class="mring" aria-hidden="true"><circle cx="54" cy="54" r="${r}" class="mring-t"/><circle cx="54" cy="54" r="${r}" class="mring-f" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 54 54)"/></svg>`; }

/* ===================== SIDEBAR ===================== */
function renderSaveStatus() {
  const el = $('#save-status'); if (!el) return;
  el.innerHTML = storageOK ? `<i class="dot g"></i>${Cloud.on ? `Synced across your devices through your Claude account${Cloud.lastSync ? ` (last synced ${new Date(Cloud.lastSync).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' })})` : ''}.` : 'Progress saves automatically in this browser.'}` : `<i class="dot r"></i>This browser is blocking storage. Progress will be lost when you close the page; use Back up to keep it.`;
}

  let h = link('#/dashboard', 'Dashboard', r[0] === 'dashboard') + link('#/review', 'Review due', r[0] === 'review' || (r[0] === 'study' && r[1] === 'all'), due ? `<span class="badge">${due}</span>` : '');
  h += `<div class="sb-label">Subjects</div><ul class="tree">`;
  SUBJECTS.forEach(s => {
    const st = stats(cardsFor('subject', s.id)), o = !!open[s.id];
    h += `<li><div class="tree-row${cur === 'subject/' + s.id ? ' active' : ''}"><button class="tw" data-action="toggle" data-key="${s.id}" aria-expanded="${o}" aria-label="${o ? 'Collapse' : 'Expand'} ${esc(s.name)}">${o ? '▾' : '▸'}</button><a href="#/subject/${s.id}" class="tree-link"><span class="tl-main">${esc(s.name)}</span></a><span class="pct">${pctTxt(st)}</span></div>`;
    if (o) {
      h += `<ul class="tree-sub">`;
      s.modules.forEach(m => {
        const has = m.decks.length > 0, ms = stats(cardsFor('module', m.id)), mo = !!open[m.id];
        h += `<li><div class="tree-row lvl2${cur === 'module/' + m.id ? ' active' : ''}${has ? '' : ' empty'}">${has ? `<button class="tw" data-action="toggle" data-key="${m.id}" aria-expanded="${mo}" aria-label="${mo ? 'Collapse' : 'Expand'} ${esc(m.code)}">${mo ? '▾' : '▸'}</button>` : '<span class="tw-sp"></span>'}<a href="#/module/${m.id}" class="tree-link"><span class="tl-main">${esc(m.code)}</span><span class="tl-sub">${esc(m.title)}</span></a><span class="pct">${has ? pctTxt(ms) : 'Empty'}</span></div>`;

            h += `<li><a href="#/deck/${d.id}" class="deck-link${act ? ' active' : ''}"><span class="dl-t">${esc(d.title)}</span><span class="pct">${pctTxt(ds)}${ds.dueToday ? `<span class="badge sm">${ds.dueToday}</span>` : ''}</span></a></li>`; });
          h += `</ul>`;
        }

      });
      h += `</ul>`;
    }
    h += `</li>`;
  });
  h += `</ul>`;
  $('#nav').innerHTML = h;
  renderSaveStatus();
  const mb = $('#mobile-due'); if (mb) mb.innerHTML = due ? `Review due <span class="badge">${due}</span>` : 'Review';
}

/* ===================== VIEWS ===================== */

/* ===================== STUDY SESSION ===================== */
let SESSION = null;
function sessionMeta(scope, id) {
  if (scope === 'deck') { const d = IDX.decks[id]; return d && { title: d.title, back: '#/deck/' + id }; }
  if (scope === 'module') { const m = IDX.modules[id]; return m && { title: `${IDX.subjects[m.subject].name} ${m.code}`, back: '#/module/' + id }; }
  if (scope === 'subject') { const s = IDX.subjects[id]; return s && { title: s.name, back: '#/subject/' + id }; }
  if (scope === 'all') return { title: 'Review due: all subjects', back: '#/review' };
}
const MODE_LABEL = { smart: 'Due and new cards', due: 'Due cards', new: 'New cards', all: 'All cards' };
function startSession(scope, id, mode) {
  const meta = sessionMeta(scope, id); if (!meta) return false;
  const queue = buildQueue(scope, id, mode).map(c => c.id);
  SESSION = { key: [scope, id, mode].join('/'), scope, id, mode, ...meta, queue, i: 0, flipped: false, tally: { green: 0, orange: 0, red: 0 }, shows: {}, hist: [], activeMs: 0 };
  Timer.lastAct = Timer.last = Date.now(); return true;
}
function endSession() { if (!SESSION) return; save(); Cloud.schedule(); SESSION = null; Timer.ctx = null; }
const curCard = () => SESSION && SESSION.i < SESSION.queue.length ? IDX.cards[SESSION.queue[SESSION.i]] : null;

function viewStudy() {
  const c = curCard(), ss = SESSION;
  if (!c) { Timer.ctx = null; return viewSessionDone(); }
  Timer.ctx = { s: c.subject, m: c.module, d: c.deck };
  const r = recOf(c.id), stt = statusOf(c.id), f = ss.flipped, deck = IDX.decks[c.deck];
  const prog = ss.queue.length ? ss.i / ss.queue.length * 100 : 0;
  return `<div class="study">
  <div class="study-h"><a class="btn sm ghost" href="${ss.back}" aria-label="Exit session">← Exit</a>
    <div class="sh-mid"><div class="sh-t">${esc(ss.title)}</div><div class="muted sm">${MODE_LABEL[ss.mode]} · card ${ss.i + 1} of ${ss.queue.length}${ss.scope !== 'deck' ? ` · ${esc(deck.title)}` : ''}</div></div>
    <div class="sh-clock${Timer.active ? '' : ' idle'}"><span id="sess-clock" class="num">${fmtClock(ss.activeMs)}</span><span id="sess-clock-lbl" class="sm">${Timer.active ? 'active study time' : 'paused while idle'}</span></div></div>
  <div class="sess-bar"><span style="width:${prog}%"></span></div>
  <div class="stage">
    <div class="flip enter${f ? ' is-flipped' : ''}" id="flip" data-action="flip" tabindex="0" role="button" aria-label="${f ? 'Showing answer. Press to see the question again' : 'Showing question. Press to reveal the answer'}">
      <div class="flip-inner">
        <section class="face front st-${stt}" aria-hidden="${f}">
          <div class="face-top"><span class="chip" title="${esc(DOT_POINTS[c.dp] || '')}">${c.dp}</span><span class="ctype">${TYPE_LABEL[c.t] || ''}</span><span class="grow"></span>${spill(stt)}</div>
          <div class="q"><div class="q-in">${fmt(c.q)}</div></div>${renderViz(c.vf)}
          <div class="face-foot"><span class="muted sm">${dueLabel(r)}</span><span class="hint">Click the card or press <kbd>Space</kbd> to flip</span></div>
        </section>
        <section class="face back st-${stt}" aria-hidden="${!f}">
          <div class="face-top"><span class="chip">${c.dp}</span><span class="ctype">Answer</span><span class="grow"></span>${spill(stt)}</div>
          <div class="q-mini">${fmt(c.q)}</div>
          <div class="ans">${fmt(c.a)}${renderViz(c.v)}</div>
        </section>
      </div>
    </div>
  </div>
  <div class="rate" id="rate">${rateBar()}</div>
  </div>`;
}
function rateBar() {
  const c = curCard(); if (!c) return '';
  if (!SESSION.flipped) return `<div class="rate-row">${undoBtn()}<button class="btn btn-primary btn-reveal" data-action="flip">Show answer <kbd>Space</kbd></button></div>`;
  const r = recOf(c.id);
  return `<p class="rate-q">How well did you know it?</p><div class="rate-btns">${[['red', 1], ['orange', 2], ['green', 3]].map(([k, n]) => { const p = nextSchedule(r, k);
    return `<button class="rate-btn rb-${k}" data-action="rate" data-r="${k}"><span class="rb-l"><i class="dot ${k[0]}"></i>${STATUS_LABEL[k]}</span><span class="rb-s">Back in ${ivlText(p, k)} <kbd>${n}</kbd></span></button>`; }).join('')}</div>${undoBtn()}`;
}
function viewSessionDone() {
  const ss = SESSION, t = ss.tally, n = t.green + t.orange + t.red;
  const scopeSt = stats(cardsFor(ss.scope, ss.id));
  if (!ss.queue.length) {
    return `<div class="page"><section class="panel empty"><h2>Nothing to study here right now</h2><p class="muted">No cards are due${ss.mode === 'smart' ? ' and there are no new cards' : ''}. ${scopeSt.nextDue < Infinity ? `Next review: ${fmtDate(scopeSt.nextDue)}.` : ''}</p><div class="flex flex-wrap gap-2 mt-3">${ss.scope !== 'all' ? `<a class="btn btn-primary" href="#/study/${ss.scope}/${ss.id}/all">Practise all ${scopeSt.n} cards anyway</a>` : ''}<a class="btn" href="${ss.back}">Go back</a></div></section></div>`;
  }
  return `<div class="page"><section class="panel done"><h1>Session complete</h1><p class="lede">${plural(n, 'rating')} in ${fmtDur(ss.activeMs)} of active study.</p>
  <div class="due-split mt-4"><div class="ds ds-green"><div class="big num">${t.green}</div><div>Got it</div></div><div class="ds ds-orange"><div class="big num">${t.orange}</div><div>Almost there</div></div><div class="ds ds-red"><div class="big num">${t.red}</div><div>Need review</div></div></div>
  <p class="muted mt-4">${esc(ss.title)} is now at <b>${pctTxt(scopeSt)}</b> mastery.${scopeSt.dueToday ? ` ${plural(scopeSt.dueToday, 'card')} still due today (Red cards return after 10 minutes).` : scopeSt.nextDue < Infinity ? ` Next review: ${fmtDate(scopeSt.nextDue)}.` : ''}</p>
  <div class="flex flex-wrap gap-2 mt-4"><a class="btn btn-primary" href="${ss.back}">Done</a>${ss.hist.length ? '<button class="btn" data-action="undo">← Change last rating</button>' : ''}<button class="btn" data-action="restart">Start another round</button><a class="btn" href="#/dashboard">Dashboard</a></div></section></div>`;
}
function flip() {
  if (!SESSION || !curCard()) return;
  SESSION.flipped = !SESSION.flipped;
  const el = $('#flip'); if (!el) return;
  el.classList.remove('enter'); el.classList.toggle('is-flipped', SESSION.flipped);
  el.setAttribute('aria-label', SESSION.flipped ? 'Showing answer. Press to see the question again' : 'Showing question. Press to reveal the answer');
  el.querySelector('.front').setAttribute('aria-hidden', SESSION.flipped); el.querySelector('.back').setAttribute('aria-hidden', !SESSION.flipped);
  $('#rate').innerHTML = rateBar();
  if (SESSION.flipped) { const b = $('.rate-btn.rb-green'); if (b && matchMedia('(pointer:fine)').matches) b.focus({ preventScroll: true }); }
}
function rate(k) {
  const c = curCard(); if (!c || !SESSION.flipped) return;
  const prev = S.cards[c.id] ? JSON.parse(JSON.stringify(S.cards[c.id])) : null;
  const rec = applyRating(c.id, k); SESSION.tally[k]++;
  let ins = -1;
  if (k === 'red') { const n = SESSION.shows[c.id] || 1; if (n < 3) { SESSION.shows[c.id] = n + 1; ins = Math.min(SESSION.queue.length, SESSION.i + 4); SESSION.queue.splice(ins, 0, c.id); } }
  SESSION.hist.push({ id: c.id, prev, k, dk: dayKey(rec.last), i: SESSION.i, ins });
  SESSION.i++; SESSION.flipped = false;
  toast(`<i class="dot ${k[0]}"></i>${STATUS_LABEL[k]}: ${k === 'red' ? 'back later this session' : 'next review ' + fmtDate(rec.due)}`);
  paintMain(); renderSidebar();
}

function undo() {
  if (!SESSION || !SESSION.hist.length) return;
  const h = SESSION.hist.pop();
  if (h.ins >= 0 && SESSION.queue[h.ins] === h.id) { SESSION.queue.splice(h.ins, 1); SESSION.shows[h.id] = Math.max(1, (SESSION.shows[h.id] || 2) - 1); }
  const restored = h.prev ? { ...h.prev } : { reps: 0 }; restored.u = Date.now(); S.cards[h.id] = restored;
  const d = myDev().rev.day[h.dk]; if (d && d[h.k[0]] > 0) d[h.k[0]]--;
  bump(); SESSION.tally[h.k] = Math.max(0, SESSION.tally[h.k] - 1); SESSION.i = h.i; SESSION.flipped = true;
  save(); Cloud.schedule(); paintMain(); renderSidebar();
  toast('Rating undone. Choose the right colour.');
}
const undoBtn = () => SESSION && SESSION.hist.length ? `<button class="btn ghost sm undo-btn" data-action="undo" title="Go back and change your last rating (Z)">← Previous card <kbd>Z</kbd></button>` : '';
